<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mein Draft - Bembel Bowl</title>
<link rel="icon" type="image/jpeg" href="images/favicon.jpg">
<link rel="stylesheet" href="css/style.css">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1f1f1f;--muted:#777;--gold:#d18b2f;--line:#dedbd3;--green:#1f7a3d;--red:#b92b2b}
body{background:var(--bg)}
.td-wrap{max-width:1200px;margin:0 auto;padding:28px 18px 70px}.td-head{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}.td-head h1{margin:0}.td-user{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.td-btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.td-btn-primary{background:var(--gold);color:#fff}.td-btn-dark{background:#272727;color:#fff}.td-btn-danger{background:var(--red);color:#fff}.td-btn:disabled{opacity:.45;cursor:not-allowed}.td-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}.td-status{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}.td-kpi{background:#faf9f6;border:1px solid var(--line);border-radius:10px;padding:14px}.td-kpi small{display:block;color:var(--muted);margin-bottom:4px}.td-kpi strong{font-size:1.15rem}.td-onclock{border:2px solid var(--gold);background:#fffaf1}.td-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.td-searchrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.td-input{width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:9px;padding:11px 12px;font:inherit}.td-searchrow .td-input{flex:1;min-width:220px}.td-filter{border:1px solid #bbb;background:#fff;border-radius:8px;padding:8px 11px;cursor:pointer;font-weight:700}.td-filter.active{background:#242424;color:#fff}.td-players{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:540px}.td-player{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid #eee;cursor:pointer}.td-player:last-child{border-bottom:0}.td-player:hover{background:#faf7f0}.td-player.disabled{opacity:.45;cursor:not-allowed}.td-pos{font-size:.76rem;font-weight:800;color:#fff;padding:4px 7px;border-radius:5px;background:#555}.td-playername{font-weight:700}.td-meta{font-size:.8rem;color:var(--muted)}.td-pickbtn{border:0;border-radius:7px;background:var(--gold);color:#fff;padding:8px 10px;font-weight:700;cursor:pointer}.td-roster{display:flex;flex-direction:column;gap:8px}.td-rosteritem{border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#faf9f6}.td-rosteritem b{display:block}.td-empty{color:#999;padding:18px;text-align:center}.td-alert{padding:12px 14px;border-radius:9px;margin-bottom:14px;display:none}.td-alert.show{display:block}.td-alert.err{background:#fff0f0;border:1px solid #efb7b7;color:#9d2222}.td-alert.ok{background:#eef9f1;border:1px solid #b8dfc2;color:#236b36}.td-login{max-width:450px;margin:50px auto}.td-login label{display:block;font-weight:700;margin:12px 0 5px}.td-badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:#eee;font-weight:800;font-size:.8rem}.td-badge.live{background:#e7f6ec;color:#1e6d37}.td-badge.off{background:#f5e8e8;color:#8a2525}
@media(max-width:800px){.td-status,.td-grid{grid-template-columns:1fr}.td-wrap{padding:18px 12px 50px}.td-player{grid-template-columns:auto 1fr}.td-pickbtn{grid-column:1/-1;width:100%}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
</head>
<body>
<header class="main-header"><nav class="navbar">
<a href="index.html" class="nav-link">Home</a><a href="rules.html" class="nav-link">Regeln</a><a href="teams.html" class="nav-link">Teams</a><a href="draft-center.html" class="nav-link active">Draft Center</a><a href="standings.html" class="nav-link">Tabellen</a><a href="reports.html" class="nav-link">Spielberichte</a><a href="hall-of-fame.html" class="nav-link">Hall of Fame</a>
</nav></header>
<main class="td-wrap">
<div id="loginView" class="td-card td-login">
<h2>Team-Login</h2><p>Mit dem Account deines Fantasy-Teams anmelden.</p>
<div id="loginError" class="td-alert err"></div>
<label>E-Mail</label><input id="email" class="td-input" type="email" autocomplete="username">
<label>Passwort</label><input id="password" class="td-input" type="password" autocomplete="current-password">
<button id="loginBtn" class="td-btn td-btn-primary" style="margin-top:16px;width:100%">Anmelden</button>
</div>
<div id="appView" style="display:none">
<div class="td-head"><div><h1 id="teamTitle">Mein Draft</h1><div id="teamSub" style="color:#777;margin-top:4px"></div></div><div class="td-user"><span id="connBadge" class="td-badge off">Offline</span><span id="userEmail"></span><button id="logoutBtn" class="td-btn td-btn-dark">Abmelden</button></div></div>
<div id="alert" class="td-alert err"></div>
<section id="statusCard" class="td-card"><div class="td-status">
<div class="td-kpi"><small>Draft-Status</small><strong id="draftStatus">–</strong></div>
<div class="td-kpi"><small>Aktuell dran</small><strong id="clockTeam">–</strong></div>
<div class="td-kpi"><small>Pick</small><strong id="clockPick">–</strong><div id="clockTimer" class="td-meta"></div></div>
</div></section>
<div class="td-grid">
<section class="td-card"><h2>Verfügbare Spieler</h2><div class="td-searchrow"><input id="search" class="td-input" placeholder="Spieler suchen …"><button class="td-filter active" data-pos="ALL">Alle</button><button class="td-filter" data-pos="QB">QB</button><button class="td-filter" data-pos="RB">RB</button><button class="td-filter" data-pos="WR">WR</button><button class="td-filter" data-pos="TE">TE</button><button class="td-filter" data-pos="K">K</button><button class="td-filter" data-pos="DEF">DEF</button></div><div id="players" class="td-players"><div class="td-empty">Spielerdaten werden geladen …</div></div></section>
<aside class="td-card"><h2>Mein Roster</h2><div id="roster" class="td-roster"><div class="td-empty">Noch keine Picks.</div></div></aside>
</div></div>
</main>
<script>
const firebaseConfig={apiKey:"AIzaSyCvcSZmqVoLoLcUF4LiOHAfvyRmr3i7jOY",authDomain:"bembel-bowl.firebaseapp.com",projectId:"bembel-bowl",storageBucket:"bembel-bowl.firebasestorage.app",messagingSenderId:"836256439134",appId:"1:836256439134:web:c39ef91c216da594020dcf"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),auth=firebase.auth();
const TEAM_COUNT=20,ROUND_COUNT=15,DRAFT_SEASON=new Date().getFullYear();
const stateRef=db.collection('drafts').doc(String(DRAFT_SEASON)).collection('state').doc('current');
const picksRef=db.collection('drafts').doc(String(DRAFT_SEASON)).collection('picks');
const locksRef=db.collection('drafts').doc(String(DRAFT_SEASON)).collection('draftedPlayers');
const auditRef=db.collection('drafts').doc(String(DRAFT_SEASON)).collection('audit');
let profile=null,state=null,allPlayers=[],draftedLocks=new Set(),teamPicks=[],filterPos='ALL',unsubs=[],timerHandle=null;
const $=id=>document.getElementById(id);
function slug(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function lockId(p){return slug((p.name||'unknown')+'__'+(p.position||'na'))||'unknown-player'}
function pickDocId(n){return String(Number(n)).padStart(3,'0')}
function tsMs(v){if(!v)return null;if(typeof v.toMillis==='function')return v.toMillis();if(v.seconds!=null)return Number(v.seconds)*1000;return null}
function elapsed(s){let n=Math.max(0,Number(s&&s.pickElapsedSeconds||0));if(s&&s.status==='ON_THE_CLOCK'&&s.pickStartedAt){const m=tsMs(s.pickStartedAt);if(m)n+=Math.max(0,(Date.now()-m)/1000)}return Math.round(n)}
function fmt(sec){sec=Math.max(0,Number(sec||0));const m=Math.floor(sec/60),s=sec%60;return m?m+'m '+String(s).padStart(2,'0')+'s':s+'s'}
function nextSlot(s){const n=Number(s.currentPickNumber)+1,r=Number(s.currentRound),p=Number(s.currentPosition);let nr=r,np=p;if(r%2===1){if(p<TEAM_COUNT)np=p+1;else{nr=r+1;np=TEAM_COUNT}}else{if(p>1)np=p-1;else{nr=r+1;np=1}}return{currentPickNumber:n,currentRound:nr,currentPosition:np,currentTeamId:s.draftTeamIds[np-1],currentTeamName:s.draftTeamNames[np-1]}}
function showAlert(msg,ok=false){const a=$('alert');a.textContent=msg;a.className='td-alert show '+(ok?'ok':'err');setTimeout(()=>a.classList.remove('show'),5000)}
function isMyTurn(){return !!(profile&&state&&state.status==='ON_THE_CLOCK'&&state.currentTeamId===profile.teamId)}
function renderState(){if(!state)return;$('draftStatus').textContent=state.status||'–';$('clockTeam').textContent=state.currentTeamName||'–';$('clockPick').textContent='#'+(state.currentPickNumber||'–')+' · Runde '+(state.currentRound||'–');$('statusCard').classList.toggle('td-onclock',isMyTurn());if(timerHandle)clearInterval(timerHandle);const tick=()=>{$('clockTimer').textContent=(state.status==='ON_THE_CLOCK'?'⏱ '+fmt(elapsed(state)):'')+(isMyTurn()?' · DU BIST DRAN':'')};tick();timerHandle=setInterval(tick,1000);renderPlayers()}
function renderRoster(){const r=$('roster');r.innerHTML='';if(!teamPicks.length){r.innerHTML='<div class="td-empty">Noch keine Picks.</div>';return}teamPicks.slice().sort((a,b)=>a.pickNumber-b.pickNumber).forEach(p=>{const d=document.createElement('div');d.className='td-rosteritem';d.innerHTML='<b>#'+p.pickNumber+' · '+escapeHtml(p.name)+'</b><span class="td-meta">'+escapeHtml(p.position||'')+(p.nflTeam?' · '+escapeHtml(p.nflTeam):'')+' · '+fmt(p.pickDurationSeconds||0)+'</span>';r.appendChild(d)})}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderPlayers(){const q=$('search').value.trim().toLowerCase(),box=$('players');box.innerHTML='';const list=allPlayers.filter(p=>(filterPos==='ALL'||p.position===filterPos)&&(!q||p.name.toLowerCase().includes(q))&&!draftedLocks.has(lockId(p))).slice(0,120);if(!list.length){box.innerHTML='<div class="td-empty">Keine verfügbaren Spieler gefunden.</div>';return}list.forEach(p=>{const row=document.createElement('div');row.className='td-player'+(isMyTurn()?'':' disabled');row.innerHTML='<span class="td-pos">'+escapeHtml(p.position||'?')+'</span><div><div class="td-playername">'+escapeHtml(p.name)+'</div><div class="td-meta">'+escapeHtml(p.nflTeam||'FA')+'</div></div><button class="td-pickbtn" '+(isMyTurn()?'':'disabled')+'>Draften</button>';row.querySelector('button').addEventListener('click',e=>{e.stopPropagation();submitPick(p)});box.appendChild(row)})}
async function loadPlayers(){try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/athletes?limit=4000');if(!r.ok)throw new Error('ESPN HTTP '+r.status);const j=await r.json(),list=Array.isArray(j&&j.athletes)?j.athletes:[];allPlayers=list.map(a=>({playerId:a.id?('espn-'+a.id):null,source:'ESPN',sourcePlayerId:a.id||null,name:a.displayName||a.fullName||a.name,position:(a.position&&(a.position.abbreviation||a.position.name))||'',nflTeam:(a.team&&(a.team.abbreviation||a.team.displayName))||''})).filter(p=>p.name&&['QB','RB','WR','TE','K','DEF'].includes(p.position));if(!allPlayers.length)throw new Error('Keine ESPN-Spieler');allPlayers.sort((a,b)=>a.name.localeCompare(b.name));renderPlayers()}catch(e){try{const r=await fetch('https://api.sleeper.app/v1/players/nfl');if(!r.ok)throw new Error('Sleeper HTTP '+r.status);const j=await r.json();allPlayers=Object.values(j).map(p=>{if(!p||!['QB','RB','WR','TE','K','DEF'].includes(p.position))return null;if(p.position==='DEF')return{playerId:p.player_id?('sleeper-'+p.player_id):null,source:'Sleeper',sourcePlayerId:p.player_id||null,name:(p.team||p.player_id)+' Defense',position:'DEF',nflTeam:p.team||p.player_id||''};return p.full_name?{playerId:p.player_id?('sleeper-'+p.player_id):null,source:'Sleeper',sourcePlayerId:p.player_id||null,name:p.full_name,position:p.position,nflTeam:p.team||''}:null}).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name));renderPlayers()}catch(x){$('players').innerHTML='<div class="td-empty">Spielerdaten konnten nicht geladen werden.</div>'}}}
async function submitPick(player){if(!isMyTurn()){showAlert('Dein Team ist aktuell nicht On the Clock.');return}if(!confirm(player.name+' ('+player.position+') wirklich draften?'))return;const expected=Number(state.currentPickNumber),pickRef=picksRef.doc(pickDocId(expected)),lId=lockId(player),lockRef=locksRef.doc(lId),aRef=auditRef.doc();try{await db.runTransaction(async tx=>{const ss=await tx.get(stateRef);if(!ss.exists)throw new Error('Draft-State fehlt.');const s=ss.data()||{};if(s.status!=='ON_THE_CLOCK'||s.currentTeamId!==profile.teamId)throw new Error('Dein Team ist nicht mehr On the Clock.');if(Number(s.currentPickNumber)!==expected)throw new Error('Der Draft ist bereits weitergelaufen.');const ps=await tx.get(pickRef),ls=await tx.get(lockRef);if(ps.exists)throw new Error('Dieser Pick ist bereits belegt.');if(ls.exists)throw new Error(player.name+' wurde bereits gedraftet.');const dur=elapsed(s),canonical={season:DRAFT_SEASON,pickId:pickDocId(expected),pickNumber:expected,round:Number(s.currentRound),positionInOrder:Number(s.currentPosition),teamId:profile.teamId,teamName:profile.teamName,playerLockId:lId,playerId:player.playerId||null,playerSource:player.source||null,sourcePlayerId:player.sourcePlayerId||null,name:player.name,position:player.position||'',nflTeam:player.nflTeam||'',pickDurationSeconds:dur,submittedAt:firebase.firestore.FieldValue.serverTimestamp(),submittedByUid:auth.currentUser.uid,submittedByEmail:auth.currentUser.email||null};tx.set(pickRef,canonical);tx.set(lockRef,{playerLockId:lId,playerId:player.playerId||null,name:player.name,position:player.position||'',nflTeam:player.nflTeam||'',pickId:pickDocId(expected),pickNumber:expected,teamId:profile.teamId,teamName:profile.teamName,createdAt:firebase.firestore.FieldValue.serverTimestamp()});if(expected>=TEAM_COUNT*ROUND_COUNT){tx.set(stateRef,{status:'COMPLETED',pickElapsedSeconds:dur,pickStartedAt:null,lastPickId:pickDocId(expected),lastPlayerLockId:lId,completedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}else{const n=nextSlot(s);tx.set(stateRef,Object.assign({},n,{status:'ON_THE_CLOCK',pickElapsedSeconds:0,pickStartedAt:firebase.firestore.FieldValue.serverTimestamp(),pausedAt:null,lastPickId:pickDocId(expected),lastPlayerLockId:lId,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}),{merge:true})}tx.set(aRef,{type:'PICK_CREATED',season:DRAFT_SEASON,createdAt:firebase.firestore.FieldValue.serverTimestamp(),actorUid:auth.currentUser.uid,actorEmail:auth.currentUser.email||null,pickId:pickDocId(expected),pickNumber:expected,round:Number(s.currentRound),positionInOrder:Number(s.currentPosition),teamId:profile.teamId,teamName:profile.teamName,playerLockId:lId,playerName:player.name,playerPosition:player.position||'',nflTeam:player.nflTeam||'',pickDurationSeconds:dur})});showAlert(player.name+' wurde gedraftet.',true)}catch(e){console.error(e);showAlert('Pick fehlgeschlagen: '+e.message)}}
function stopListeners(){unsubs.forEach(fn=>{try{fn()}catch(e){}});unsubs=[];if(timerHandle){clearInterval(timerHandle);timerHandle=null}}
function startListeners(){stopListeners();unsubs.push(stateRef.onSnapshot(s=>{state=s.exists?s.data():null;$('connBadge').textContent='Live';$('connBadge').className='td-badge live';renderState()},e=>{console.error(e);$('connBadge').textContent='Offline';$('connBadge').className='td-badge off'}));unsubs.push(locksRef.onSnapshot(s=>{draftedLocks=new Set();s.forEach(d=>draftedLocks.add(d.id));renderPlayers()}));unsubs.push(picksRef.onSnapshot(s=>{teamPicks=[];s.forEach(d=>{const p=d.data()||{};if(p.teamId===profile.teamId)teamPicks.push(p)});renderRoster()}))}
$('loginBtn').addEventListener('click',async()=>{const e=$('loginError');e.classList.remove('show');try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value)}catch(err){e.textContent='Anmeldung fehlgeschlagen: E-Mail oder Passwort falsch.';e.classList.add('show')}});$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});$('logoutBtn').addEventListener('click',()=>auth.signOut());$('search').addEventListener('input',renderPlayers);document.querySelectorAll('.td-filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.td-filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filterPos=b.dataset.pos;renderPlayers()}));
auth.onAuthStateChanged(async user=>{stopListeners();profile=null;state=null;if(!user){$('loginView').style.display='block';$('appView').style.display='none';return}try{const d=await db.collection('users').doc(user.uid).get();if(!d.exists)throw new Error('Für diesen Account ist kein Team hinterlegt.');profile=d.data()||{};if(profile.role!=='team'||!profile.teamId)throw new Error('Dieser Account ist kein Team-Account.');$('teamTitle').textContent=profile.teamName||profile.teamId;$('teamSub').textContent='Saison '+DRAFT_SEASON+' · Persönliche Draft-Seite';$('userEmail').textContent=user.email||'';$('loginView').style.display='none';$('appView').style.display='block';startListeners();loadPlayers()}catch(e){await auth.signOut();const box=$('loginError');box.textContent=e.message;box.classList.add('show')}});
</script>
</body></html>
