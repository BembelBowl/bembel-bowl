<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draft-Reihenfolge | Bembel Bowl</title><link rel="icon" href="images/favicon.jpg"><link rel="stylesheet" href="css/style.css"><style>
header{position:fixed!important;top:0;left:0;width:100%;z-index:1000}body{padding-top:70px;background:#f4f1ea}.site-login-btn{background:#d18b2f;color:#fff;text-decoration:none;font-weight:700;padding:9px 16px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.12);transition:.2s}.site-login-btn:hover{background:#b8781f;transform:translateY(-1px)}.dog-header{text-align:center;margin:40px auto 30px;padding:0 25px}.dog-header h2{color:#d18b2f;font-size:2.5rem;margin-bottom:10px}.dog-header p{color:#666;font-size:1.05rem}.archive-tabs{display:flex;flex-wrap:wrap;gap:8px;max-width:1300px;margin:0 auto 22px;padding:0 25px}.archive-tab{border:1px solid #e0ded6;background:#fff;color:#1f1f1f;border-radius:7px;padding:9px 14px;font-weight:700;cursor:pointer}.archive-tab:hover{border-color:#d18b2f;background:#fff8ec}.archive-tab.active{background:#d18b2f;border-color:#d18b2f;color:#fff}.dog-draft-container{max-width:1300px;margin:0 auto 60px;padding:0 25px;display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:start}.dog-draft-left h3,.dog-draft-right h3{color:#1f1f1f;border-bottom:3px solid #d18b2f;padding-bottom:8px;margin-bottom:20px;font-size:1.4rem}.dog-reveal-stage{background:#1f1f1f;border:3px solid #d18b2f;border-radius:12px;min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;box-shadow:0 8px 25px rgba(0,0,0,.25)}.dog-reveal-place{color:#d18b2f;font-size:1.3rem;font-weight:700;letter-spacing:1px;margin-bottom:18px;text-transform:uppercase}.dog-reveal-logo{width:190px;height:190px;object-fit:cover;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.4);margin-bottom:22px}.dog-reveal-name{color:#fff;font-size:1.9rem;font-weight:700;text-align:center}.dog-result-list{list-style:none;display:flex;flex-direction:column;gap:8px;background:#fff;border-radius:12px;padding:18px;box-shadow:0 4px 15px rgba(0,0,0,.05)}.dog-result-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;border-left:4px solid #d18b2f;background:#fff8ec}.dog-result-place{flex:0 0 32px;font-weight:700;color:#1f1f1f}.dog-result-logo{width:34px;height:34px;border-radius:6px;object-fit:cover;background:#1f1f1f}.dog-result-name{flex:1;color:#1f1f1f;font-weight:600}.dog-muted{color:#888;font-size:.9rem}@media(max-width:900px){.dog-draft-container{grid-template-columns:1fr}}@media(max-width:768px){header{position:sticky!important}body{padding-top:0}.site-login-btn{margin-left:0}}
</style></head><body><header class="main-header"><nav class="navbar"><a href="index.html" class="nav-link">Home</a><a href="rules.html" class="nav-link">Regeln</a><a href="teams.html" class="nav-link">Teams</a><a href="draft-center.html" class="nav-link active">Draft Center</a><a href="standings.html" class="nav-link">Tabellen</a><a href="reports.html" class="nav-link">Spielberichte</a><a href="hall-of-fame.html" class="nav-link">Hall of Fame</a><a href="https://fantasy.espn.com/football/league?leagueId=843833275" class="espn-btn" target="_blank">ESPN Fantasy Login</a><a href="login.html" class="site-login-btn">Login</a></nav></header><section class="dog-header"><h2>Draft-Reihenfolge</h2></section><div id="seasonTabs" class="archive-tabs"></div><main class="dog-draft-container"><section class="dog-draft-left"><h3>Auslosung</h3><div class="dog-reveal-stage"><div id="revealPlace" class="dog-reveal-place">Warte auf Auslosung</div><img id="revealLogo" class="dog-reveal-logo" src="images/favicon.jpg" alt=""><div id="revealName" class="dog-reveal-name">—</div></div></section><section class="dog-draft-right"><h3>Draft Order</h3><p id="seasonLabel" class="dog-muted"></p><div id="orderList" class="dog-result-list"></div></section></main><footer><p>© 2026 Bembel Bowl Fantasy Football League</p></footer><script type="module">
import { watchDraftOrder, listDraftOrderArchiveSeasons, getDraftOrderArchive } from './js/draft/service.js';
import { teamLogo } from './js/draft/config.js';
const $=id=>document.getElementById(id);
let currentData={}; let selectedSeason=null; let archiveSeasons=[]; let stopCurrent=null; let userSelectedSeason=false;

function hasCurrentData(d){
  return !!((d?.order||[]).filter(Boolean).length || (d?.revealSequence||[]).length);
}
function renderTabs(){
  const currentSeason=hasCurrentData(currentData)?Number(currentData.season):null;
  const seasons=[...new Set([...(currentSeason?[currentSeason]:[]),...archiveSeasons])].filter(Number.isInteger).sort((a,b)=>b-a);
  if(!userSelectedSeason) selectedSeason=seasons[0] || null;
  if(selectedSeason && !seasons.includes(Number(selectedSeason))) selectedSeason=seasons[0] || null;
  $('seasonTabs').innerHTML=seasons.map(y=>`<button class="archive-tab ${Number(selectedSeason)===y?'active':''}" data-season="${y}">${y}${currentSeason===y && currentData.status!=='complete'?' LIVE':''}</button>`).join('');
}
function render(d){
  d=d||{}; const seq=d.revealSequence||[], count=Number(d.revealedCount||0), final=d.order||[];
  $('seasonLabel').textContent=d.season?`Saison ${d.season}`:'';
  let revealed=[];
  if(final.length) revealed=final.map((team,i)=>({place:i+1,team})); else revealed=seq.slice(0,count);
  const sorted=[...revealed].sort((a,b)=>a.place-b.place);
  $('orderList').innerHTML=sorted.length?sorted.map(x=>`<div class="dog-result-item"><b class="dog-result-place">${x.place}.</b><img class="dog-result-logo" src="${teamLogo(x.team)}" alt=""><span class="dog-result-name">${x.team}</span></div>`).join(''):'<p class="dog-muted">Für diese Saison liegt keine Draft Order vor.</p>';
  if(count>0&&seq[count-1]&&!final.length){const x=seq[count-1];$('revealPlace').textContent=`PLATZ ${x.place}`;$('revealLogo').src=teamLogo(x.team);$('revealName').textContent=x.team;}
  else if(final.length){$('revealPlace').textContent='AUSLOSUNG ABGESCHLOSSEN';$('revealLogo').src='images/favicon.jpg';$('revealName').textContent=`Draft Order ${d.season||''}`;}
  else {$('revealPlace').textContent='Warte auf Auslosung';$('revealLogo').src='images/favicon.jpg';$('revealName').textContent='—';}
}
async function selectSeason(year){
  selectedSeason=Number(year); renderTabs();
  const currentSeason=Number(currentData?.season);
  if(selectedSeason===currentSeason && hasCurrentData(currentData)) render(currentData);
  else render(await getDraftOrderArchive(selectedSeason));
}
$('seasonTabs').addEventListener('click',e=>{const b=e.target.closest('[data-season]');if(b){userSelectedSeason=true;selectSeason(b.dataset.season);}});
archiveSeasons=await listDraftOrderArchiveSeasons().catch(()=>[]);
stopCurrent=watchDraftOrder(d=>{
  currentData=d||{};
  renderTabs();
  const currentSeason=Number(currentData?.season);
  if(Number(selectedSeason)===currentSeason && hasCurrentData(currentData)) render(currentData);
  else if(selectedSeason) getDraftOrderArchive(selectedSeason).then(render);
});
</script><script src="js/site-nav.js" defer></script>
</body></html>
