<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draft-Reihenfolge | Bembel Bowl</title><link rel="icon" href="images/favicon.jpg"><link rel="stylesheet" href="css/style.css"><style>
.draw-wrap{max-width:1180px;margin:38px auto 70px;padding:0 24px}.draw-head{text-align:center;margin-bottom:24px}.draw-head h2{color:#d18b2f;font-size:2.4rem;margin-bottom:8px}.draw-layout{display:grid;grid-template-columns:.8fr 1.2fr;gap:24px}.reveal-card,.order-card{background:#fff;border-radius:14px;box-shadow:0 5px 20px rgba(0,0,0,.07);padding:24px}.reveal-stage{min-height:360px;border-radius:12px;background:#1f1f1f;border:3px solid #d18b2f;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.reveal-stage span{color:#d18b2f;font-weight:900;letter-spacing:.12em}.reveal-stage img{width:170px;height:170px;object-fit:contain;border-radius:16px;background:#fff;margin:18px 0;padding:6px}.reveal-stage h3{color:#fff;font-size:1.8rem;margin:0}.order-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}.order-row{display:grid;grid-template-columns:34px 42px 1fr;align-items:center;gap:9px;background:#f8f6f0;border-left:4px solid #d18b2f;border-radius:8px;padding:8px}.order-row img{width:38px;height:38px;object-fit:contain;border-radius:7px;background:#fff}.muted{color:#777;text-align:center}.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2b8a3e;margin-right:5px}@media(max-width:800px){.draw-layout{grid-template-columns:1fr}.order-list{grid-template-columns:1fr}}</style></head>
<body><header class="main-header"><nav class="navbar"><a href="index.html" class="nav-link">Home</a><a href="rules.html" class="nav-link">Regeln</a><a href="teams.html" class="nav-link">Teams</a><a href="draft-center.html" class="nav-link active">Draft Center</a><a href="standings.html" class="nav-link">Tabellen</a><a href="reports.html" class="nav-link">Spielberichte</a><a href="hall-of-fame.html" class="nav-link">Hall of Fame</a></nav></header>
<main class="draw-wrap"><div class="draw-head"><h2>Draft-Reihenfolge</h2><p><span class="live-dot"></span>Live-Anzeige der vom Admin gesteuerten Auslosung</p></div><div class="draw-layout"><section class="reveal-card"><div class="reveal-stage"><span id="revealPlace">Warte auf Auslosung</span><img id="revealLogo" src="images/favicon.jpg" alt=""><h3 id="revealName">—</h3></div></section><section class="order-card"><h3>Draft Order</h3><p id="seasonLabel" class="muted"></p><div id="orderList" class="order-list"></div></section></div></main><footer><p>© 2026 Bembel Bowl Fantasy Football League</p></footer>
<script type="module">
import { watchDraftOrder } from './js/draft/service.js'; import { teamLogo } from './js/draft/config.js';
const $=id=>document.getElementById(id); let previous=0;
watchDraftOrder(d=>{ const seq=d.revealSequence||[], count=Number(d.revealedCount||0), final=d.order||[]; $('seasonLabel').textContent=d.season?`Saison ${d.season}`:''; let revealed=[]; if(final.length) revealed=final.map((team,i)=>({place:i+1,team})); else revealed=seq.slice(0,count); const sorted=[...revealed].sort((a,b)=>a.place-b.place); $('orderList').innerHTML=sorted.length?sorted.map(x=>`<div class="order-row"><b>${x.place}.</b><img src="${teamLogo(x.team)}" alt=""><span>${x.team}</span></div>`).join(''):'<p class="muted">Noch keine Teams aufgedeckt.</p>'; if(count>0&&seq[count-1]){const x=seq[count-1];$('revealPlace').textContent=`PLATZ ${x.place}`;$('revealLogo').src=teamLogo(x.team);$('revealName').textContent=x.team;} else if(final.length){$('revealPlace').textContent='AUSLOSUNG ABGESCHLOSSEN';$('revealLogo').src='images/favicon.jpg';$('revealName').textContent='Draft Order gespeichert';} else {$('revealPlace').textContent='Warte auf Auslosung';$('revealName').textContent='—';} previous=count;});
</script></body></html>
