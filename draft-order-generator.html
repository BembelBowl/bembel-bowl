<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draft-Reihenfolge | Bembel Bowl</title><link rel="icon" href="images/favicon.jpg"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/draft-master.css"></head>
<body class="master-page"><header class="main-header"><nav class="navbar"><a href="index.html" class="nav-link">Home</a><a href="rules.html" class="nav-link">Regeln</a><a href="teams.html" class="nav-link">Teams</a><a href="draft-center.html" class="nav-link active">Draft Center</a><a href="standings.html" class="nav-link">Tabellen</a><a href="reports.html" class="nav-link">Spielberichte</a><a href="hall-of-fame.html" class="nav-link">Hall of Fame</a><a href="https://fantasy.espn.com/football/league?leagueId=843833275" class="nav-link espn-btn" target="_blank">ESPN Fantasy Login</a><a href="login.html" class="site-login-btn">Login</a></nav></header>
<main class="master-wrap"><div class="master-head"><h2>Draft-Reihenfolge</h2><p><span class="live-dot"></span>Live-Anzeige der vom Admin gesteuerten Auslosung</p></div><div class="draw-layout"><section class="master-card"><div class="reveal-stage"><span id="revealPlace">Warte auf Auslosung</span><img id="revealLogo" src="images/favicon.jpg" alt=""><h3 id="revealName">—</h3></div></section><section class="master-card"><h3>Draft Order</h3><p id="seasonLabel" class="muted"></p><div id="orderList" class="order-list"></div></section></div></main><footer><p>© 2026 Bembel Bowl Fantasy Football League</p></footer>
<script type="module">
import { watchDraftOrder } from './js/draft/service.js'; import { teamLogo } from './js/draft/config.js';
const $=id=>document.getElementById(id); let previous=0;
watchDraftOrder(d=>{ const seq=d.revealSequence||[], count=Number(d.revealedCount||0), final=d.order||[]; $('seasonLabel').textContent=d.season?`Saison ${d.season}`:''; let revealed=[]; if(final.length) revealed=final.map((team,i)=>({place:i+1,team})); else revealed=seq.slice(0,count); const sorted=[...revealed].sort((a,b)=>a.place-b.place); $('orderList').innerHTML=sorted.length?sorted.map(x=>`<div class="order-row"><b>${x.place}.</b><img src="${teamLogo(x.team)}" alt=""><span>${x.team}</span></div>`).join(''):'<p class="muted">Noch keine Teams aufgedeckt.</p>'; if(count>0&&seq[count-1]){const x=seq[count-1];$('revealPlace').textContent=`PLATZ ${x.place}`;$('revealLogo').src=teamLogo(x.team);$('revealName').textContent=x.team;} else if(final.length){$('revealPlace').textContent='AUSLOSUNG ABGESCHLOSSEN';$('revealLogo').src='images/favicon.jpg';$('revealName').textContent='Draft Order gespeichert';} else {$('revealPlace').textContent='Warte auf Auslosung';$('revealName').textContent='—';} previous=count;});
</script></body></html>
