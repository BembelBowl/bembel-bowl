header{position:fixed!important;top:0;left:0;width:100%;z-index:1000}body{padding-top:70px;background:#f4f1ea}.site-login-btn{background:#d18b2f;color:#fff;text-decoration:none;font-weight:700;padding:9px 16px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.12);transition:.2s}.site-login-btn:hover{background:#b8781f;transform:translateY(-1px)}.dog-header{text-align:center;margin:40px auto 20px;padding:0 25px}.dog-header h2{color:#d18b2f;font-size:2.5rem;margin-bottom:10px}.dog-header p{color:#666;font-size:1.05rem}.archive-tabs{display:flex;flex-wrap:wrap;gap:8px;max-width:1300px;margin:0 auto 22px;padding:0 25px}.archive-tab{border:1px solid #e0ded6;background:#fff;color:#1f1f1f;border-radius:7px;padding:9px 14px;font-weight:700;cursor:pointer}.archive-tab:hover{border-color:#d18b2f;background:#fff8ec}.archive-tab.active{background:#d18b2f;border-color:#d18b2f;color:#fff}.dog-container{max-width:1300px;margin:0 auto 60px;padding:0 25px}.dog-reveal-stage{background:#1f1f1f;border:3px solid #d18b2f;border-radius:12px;min-height:220px;display:flex;align-items:center;justify-content:center;gap:28px;padding:24px;margin-bottom:24px;box-shadow:0 8px 25px rgba(0,0,0,.25)}.dog-reveal-stage img{width:120px;height:120px;object-fit:cover;border-radius:12px}.dog-reveal-stage b{display:block;color:#d18b2f;font-size:1.05rem;letter-spacing:1px;margin-bottom:8px}.dog-reveal-stage h3{color:#fff;font-size:1.7rem;margin:0}.dog-division-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px}.dog-division-col{background:#fff;border-radius:12px;padding:16px;box-shadow:0 4px 15px rgba(0,0,0,.05)}.dog-division-title{text-align:center;font-weight:700;color:#fff;background:#1f1f1f;border-radius:8px;padding:8px;margin-bottom:12px;letter-spacing:1px}.dog-division-title .div-letter{color:#d18b2f}.dog-division-slot{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:#f8f6f0;border:2px dashed #e0ded6;border-radius:8px;padding:1 </style></head><body><header class="main-header"><nav class="navbar"><a href="index.html" class="nav-link">Home</a><a href="rules.html" class="nav-link">Regeln</a><a href="teams.html" class="nav-link">Teams</a><a href="draft-center.html" class="nav-link active">Draft Center</a><a href="standings.html" class="nav-link">Tabellen</a><a href="reports.html" class="nav-link">Spielberichte</a><a href="hall-of-fame.html" class="nav-link">Hall of Fame</a><a href="https://fantasy.espn.com/football/league?leagueId=843833275" class="espn-btn" target="_blank">ESPN Fantasy Login</a><a href="login.html" class="site-login-btn">Login</a></nav></header><section class="dog-header"><h2>Division-Auslosung</h2></section><div id="seasonTabs" class="archive-tabs"></div><main class="dog-container"><section class="dog-reveal-stage"><img id="revealLogo" src="images/favicon.jpg" alt=""><div><b id="revealSlot">Warte auf Auslosung</b><h3 id="revealTeam">—</h3></div></section><div id="divisionGrid" class="dog-division-grid"></div><h3 id="scheduleTitle" class="dog-schedule-title" style="display:none">Spielplan</h3><div id="scheduleTabs" class="dog-schedule-tabs" style="display:none"></div><div id="scheduleGrid" class="dog-schedule-grid"></div></main><footer><p>© 2026 Bembel Bowl Fantasy Football League</p></footer><script type="module">
import { watchDivisions, listDivisionArchiveSeasons, getDivisionArchive } from './js/draft/service.js';
import { teamLogo } from './js/draft/config.js'; const $=id=>document.getElementById(id);
const MATRIX={
'1':[['A1','A2'],['A3','A4'],['A5','C5'],['B1','B2'],['B3','B4'],['B5','D5'],['C1','C2'],['C3','C4'],['D1','D2'],['D3','D4']],
'2':[['A1','A3'],['A2','C2'],['A4','A5'],['B1','B3'],['B2','D2'],['B4','B5'],['C1','C3'],['C4','C5'],['D1','D3'],['D4','D5']],
'3':[['A1','A4'],['A2','A5'],['A3','C3'],['B1','B4'],['B2','B5'],['B3','D3'],['C1','C4'],['C2','C5'],['D1','D4'],['D2','D5']],
'4':[['A1','A5'],['A2','A3'],['A4','C4'],['B1','B5'],['B2','B3'],['B4','D4'],['C1','C5'],['C2','C3'],['D1','D5'],['D2','D3']],
'5':[['A1','C1'],['A2','A4'],['A3','A5'],['B1','D1'],['B2','B4'],['B3','B5'],['C2','C4'],['C3','C5'],['D2','D4'],['D3','D5']],
'6':[['A1','B1'],['A2','B2'],['A3','B3'],['A4','B4'],['A5','B5'],['C1','D1'],['C2','D2'],['C3','D3'],['C4','D4'],['C5','D5']],
'7':[['A1','D1'],['A2','D2'],['A3','D3'],['A4','D4'],['A5','D5'],['B1','C1'],['B2','C2'],['B3','C3'],['B4','C4'],['B5','C5']],
'8':[['A1','D1'],['A2','D2'],['A3','D3'],['A4','D4'],['A5','D5'],['B1','C1'],['B2','C2'],['B3','C3'],['B4','C4'],['B5','C5']],
'9':[['A1','B1'],['A2','B2'],['A3','B3'],['A4','B4'],['A5','B5'],['C1','D1'],['C2','D2'],['C3','D3'],['C4','D4'],['C5','D5']],
'10':[['A1','C1'],['A2','A4'],['A3','A5'],['B1','D1'],['B2','B4'],['B3','B5'],['C2','C4'],['C3','C5'],['D2','D4'],['D3','D5']],
'11':[['A1','A5'],['A2','A3'],['A4','C4'],['B1','B5'],['B2','B3'],['B4','D4'],['C1','C5'],['C2','C3'],['D1','D5'],['D2','D3']],
'12':[['A1','A4'],['A2','A5'],['A3','C3'],['B1','B4'],['B2','B5'],['B3','D3'],['C1','C4'],['C2','C5'],['D1','D4'],['D2','D5']],
'13':[['A1','A3'],['A2','C2'],['A4','A5'],['B1','B3'],['B2','D2'],['B4','B5'],['C1','C3'],['C4','C5'],['D1','D3'],['D4','D5']],
'14':[['A1','A2'],['A3','A4'],['A5','C5'],['B1','B2'],['B3','B4'],['B5','D5'],['C1','C2'],['C3','C4'],['D1','D2'],['D3','D4']]};

let selectedScheduleWeek='1'; let currentData={}; let archiveSeasons=[]; let selectedSeason=null; let userSelectedSeason=false; let recoveredEspn=null;
function hasCurrentData(d){return !!(d?.divisions || (d?.revealSequence||[]).length);}
function renderTabs(){
 const currentSeason=hasCurrentData(currentData)?Number(currentData.season):null;
 const seasons=[...new Set([...(currentSeason?[currentSeason]:[]),...archiveSeasons,2026])].filter(Number.isInteger).sort((a,b)=>b-a);
 if(!userSelectedSeason) selectedSeason=seasons[0]||null;
 if(selectedSeason && !seasons.includes(Number(selectedSeason))) selectedSeason=seasons[0]||null;
 $('seasonTabs').innerHTML=seasons.map(y=>`<button class="archive-tab ${Number(selectedSeason)===y?'active':''}" data-season="${y}">${y}${currentSeason===y && currentData.status!=='complete'?' LIVE':''}</button>`).join('');
}
function renderSchedule(divs){
 if(recoveredEspn && Number(selectedSeason)===Number(recoveredEspn.season)){
   const weeks=recoveredEspn.schedule||{};
   const weekKeys=Object.keys(weeks).sort((a,b)=>Number(a)-Number(b));
   if(!weekKeys.length){$('scheduleTitle').style.display='none';$('scheduleTabs').style.display='none';$('scheduleGrid').innerHTML='';return;}
   $('scheduleTitle').style.display='block';$('scheduleTabs').style.display='flex';
   if(!weeks[selectedScheduleWeek]) selectedScheduleWeek=weekKeys[0];
   $('scheduleTabs').innerHTML=weekKeys.map(w=>`<button class="dog-schedule-tab ${w===selectedScheduleWeek?'active':''}" data-week="${w}">Spieltag ${w}</button>`).join('');
   const games=weeks[selectedScheduleWeek]||[];
   $('scheduleGrid').innerHTML=`<section class="dog-week-card"><h4 class="dog-week-title">Spieltag ${selectedScheduleWeek}</h4>${games.map(g=>`<div class="dog-game-row"><span class="dog-game-team">${g.home}</span><b class="dog-vs">VS</b><span class="dog-game-team">${g.away}</span></div>`).join('')}</section>`;
   return;
 }
 const pos={};['A','B','C','D'].forEach(l=>(divs[l]||[]).forEach((team,i)=>{if(team)pos[l+(i+1)]=team;}));
 if(Object.keys(pos).length<20){$('scheduleTitle').style.display='none';$('scheduleTabs').style.display='none';$('scheduleTabs').innerHTML='';$('scheduleGrid').innerHTML='';return;}
 $('scheduleTitle').style.display='block';$('scheduleTabs').style.display='flex';if(!MATRIX[selectedScheduleWeek])selectedScheduleWeek='1';
 $('scheduleTabs').innerHTML=Object.keys(MATRIX).map(w=>`<button class="dog-schedule-tab ${w===selectedScheduleWeek?'active':''}" data-week="${w}">Spieltag ${w}</button>`).join('');
 const games=MATRIX[selectedScheduleWeek]||[];$('scheduleGrid').innerHTML=`<section class="dog-week-card"><h4 class="dog-week-title">Spieltag ${selectedScheduleWeek}</h4>${games.map(([a,b])=>`<div class="dog-game-row"><span class="dog-game-team">${pos[a]||a}</span><b class="dog-vs">VS</b><span class="dog-game-team">${pos[b]||b}</span></div>`).join('')}</section>`;
}
function render(d){
 d=d||{}; const seq=d.revealSequence||[],count=Number(d.revealedCount||0),complete=d.divisions;const divs={A:[],B:[],C:[],D:[]};
 if(complete)Object.assign(divs,complete);else seq.slice(0,count).forEach(x=>divs[x.division][x.slot-1]=x.team);window.__bbDivisions=divs;
 $('divisionGrid').innerHTML=['A','B','C','D'].map(l=>`<section class="dog-division-col"><h3 class="dog-division-title">Division <span class="div-letter">${l}</span></h3>${Array.from({length:5},(_,i)=>{const t=divs[l]?.[i];return `<div class="dog-division-slot ${t?'filled':''}">${t?`<img class="dog-slot-logo" src="${teamLogo(t)}" alt=""><span class="dog-slot-name">${t}</span>`:`<span class="dog-slot-placeholder">${l}${i+1} · offen</span>`}</div>`}).join('')}</section>`).join('');
 renderSchedule(divs);
 if(count&&seq[count-1]&&!complete){const x=seq[count-1];$('revealSlot').textContent=`DIVISION ${x.division} · PLATZ ${x.slot}`;$('revealLogo').src=teamLogo(x.team);$('revealTeam').style.display='';$('revealTeam').textContent=x.team;}
 else if(complete){$('revealSlot').textContent='AUSLOSUNG ABGESCHLOSSEN';$('revealTeam').textContent=d.season?`Saison ${d.season}`:'';$('revealTeam').style.display=d.season?'':'none';$('revealLogo').src='images/favicon.jpg';}
 else {$('revealSlot').textContent='Warte auf Auslosung';$('revealTeam').textContent='—';$('revealTeam').style.display='';$('revealLogo').src='images/favicon.jpg';}
}

async function fetchEspnDivisionRecovery(season){
 const leagueId='843833275';
 const urls=[
  `https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/${season}/segments/0/leagues/${leagueId}?view=mTeam&view=mSettings&view=mMatchup`,
  `https://fantasy.espn.com/apis/v3/games/ffl/seasons/${season}/segments/0/leagues/${leagueId}?view=mTeam&view=mSettings&view=mMatchup`
 ];
 let json=null,lastErr=null;
 for(const url of urls){
  try{const r=await fetch(url,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`ESPN HTTP ${r.status}`);json=await r.json();break;}catch(e){lastErr=e;}
 }
 if(!json)throw lastErr||new Error('ESPN nicht erreichbar');
 const divSettings=json?.settings?.scheduleSettings?.divisions||[];
 const divIds=[...new Set((json.teams||[]).map(t=>t.divisionId).filter(v=>v!=null))].sort((a,b)=>Number(a)-Number(b));
 const letters=['A','B','C','D']; const idToLetter={};
 divIds.slice(0,4).forEach((id,i)=>idToLetter[String(id)]=letters[i]);
 const divisions={A:[],B:[],C:[],D:[]}; const teamById={};
 (json.teams||[]).forEach(t=>{
   const name=t.name||`${t.location||''} ${t.nickname||''}`.trim()||`Team ${t.id}`;
   teamById[String(t.id)]=name;
   const letter=idToLetter[String(t.divisionId)];
   if(letter)divisions[letter].push({id:Number(t.id)||0,name});
 });
 Object.keys(divisions).forEach(k=>divisions[k]=divisions[k].sort((a,b)=>a.id-b.id).map(x=>x.name));
 const schedule={};
 (json.schedule||[]).forEach(m=>{
   const week=String(m.matchupPeriodId||m.scoringPeriodId||'');
   const home=teamById[String(m.home?.teamId??m.home?.team?.id??'')];
   const away=teamById[String(m.away?.teamId??m.away?.team?.id??'')];
   if(week&&home&&away)(schedule[week]||(schedule[week]=[])).push({home,away});
 });
 return {season:Number(season),divisions,status:'complete',recoveredFrom:'ESPN',schedule};
}
async function loadDivisionSeason(year){
 const currentSeason=Number(currentData?.season);
 recoveredEspn=null;
 if(Number(year)===currentSeason&&hasCurrentData(currentData)){render(currentData);return;}
 const archived=await getDivisionArchive(year);
 if(archived){render(archived);return;}
 if(Number(year)===2026){
   try{
     recoveredEspn=await fetchEspnDivisionRecovery(2026);
     render(recoveredEspn);
     $('revealSlot').textContent='AUS ESPN WIEDERHERGESTELLT';
     $('revealTeam').style.display='';
     $('revealTeam').textContent='Saison 2026';
     return;
   }catch(e){
     console.warn('2026 Division-Recovery fehlgeschlagen:',e);
   }
 }
 render({season:Number(year)});
}
async function selectSeason(year){selectedSeason=Number(year);renderTabs();await loadDivisionSeason(selectedSeason);}

$('seasonTabs').addEventListener('click',e=>{const b=e.target.closest('[data-season]');if(b){userSelectedSeason=true;selectSeason(b.dataset.season);}});
$('scheduleTabs').addEventListener('click',e=>{const btn=e.target.closest('[data-week]');if(!btn)return;selectedScheduleWeek=btn.dataset.week;renderSchedule(window.__bbDivisions||{A:[],B:[],C:[],D:[]});});
archiveSeasons=await listDivisionArchiveSeasons().catch(()=>[]);
watchDivisions(d=>{
 currentData=d||{};
 renderTabs();
 if(selectedSeason) loadDivisionSeason(selectedSeason);
});
</script><script src="js/site-nav.js" defer></script>
