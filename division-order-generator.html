<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Division-Auslosung | Bembel Bowl</title><link rel="icon" href="images/favicon.jpg"><link rel="stylesheet" href="css/style.css"><style>
.div-wrap{max-width:1280px;margin:38px auto 70px;padding:0 24px}.div-head{text-align:center;margin-bottom:24px}.div-head h2{color:#d18b2f;font-size:2.4rem}.reveal{background:#1f1f1f;border:3px solid #d18b2f;border-radius:14px;padding:20px;display:flex;align-items:center;justify-content:center;gap:18px;color:#fff;margin-bottom:22px;min-height:120px}.reveal img{width:82px;height:82px;object-fit:contain;background:#fff;border-radius:10px;padding:4px}.reveal b{color:#d18b2f;font-size:1.1rem}.division-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.division{background:#fff;border-radius:12px;padding:14px;box-shadow:0 4px 15px rgba(0,0,0,.06)}.division h3{background:#1f1f1f;color:#fff;border-bottom:3px solid #d18b2f;border-radius:8px;padding:10px;text-align:center}.slot{display:flex;align-items:center;gap:8px;background:#f8f6f0;border-radius:8px;padding:8px;margin-top:7px;min-height:50px}.slot img{width:36px;height:36px;object-fit:contain;border-radius:6px;background:#fff}.muted{color:#888}.schedule-title{margin:34px 0 12px;color:#1f1f1f;border-bottom:3px solid #d18b2f;padding-bottom:8px}.schedule-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.week{background:#fff;border-radius:10px;padding:12px;box-shadow:0 3px 12px rgba(0,0,0,.05)}.week h4{margin:0 0 8px;color:#d18b2f}.game{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:center;font-size:.76rem;padding:5px 0;border-bottom:1px solid #eee}.game span:last-child{text-align:right}@media(max-width:900px){.division-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.division-grid{grid-template-columns:1fr}}</style></head>
<body><header class="main-header"><nav class="navbar"><a href="index.html" class="nav-link">Home</a><a href="rules.html" class="nav-link">Regeln</a><a href="teams.html" class="nav-link">Teams</a><a href="draft-center.html" class="nav-link active">Draft Center</a><a href="standings.html" class="nav-link">Tabellen</a><a href="reports.html" class="nav-link">Spielberichte</a><a href="hall-of-fame.html" class="nav-link">Hall of Fame</a></nav></header>
<main class="div-wrap"><div class="div-head"><h2>Division-Auslosung</h2><p>Live-Anzeige der vom Admin gesteuerten Auslosung</p></div><div class="reveal"><img id="revealLogo" src="images/favicon.jpg" alt=""><div><b id="revealSlot">Warte auf Auslosung</b><h3 id="revealTeam">—</h3></div></div><div id="divisionGrid" class="division-grid"></div><h3 id="scheduleTitle" class="schedule-title" style="display:none">Spielplan</h3><div id="scheduleGrid" class="schedule-grid"></div></main><footer><p>© 2026 Bembel Bowl Fantasy Football League</p></footer>
<script type="module">
import { watchDivisions } from './js/draft/service.js'; import { teamLogo } from './js/draft/config.js'; const $=id=>document.getElementById(id);
const MATRIX={
'1':[['A1','A2'],['A3','A4'],['A5','C5'],['B1','B2'],['B3','B4'],['B5','D5'],['C1','C2'],['C3','C4'],['D1','D2'],['D3','D4']],
'2':[['A1','A3'],['A2','C2'],['A4','A5'],['B1','B3'],['B2','D2'],['B4','B5'],['C1','C3'],['C4','C5'],['D1','D3'],['D4','D5']],
'3':[['A1','A4'],['A2','A5'],['A3','C3'],['B1','B4'],['B2','B5'],['B3','D3'],['C1','C4'],['C2','C5'],['D1','D4'],['D2','D5']],
'4':[['A1','A5'],['A2','A3'],['A4','C4'],['B1','B5'],['B2','B3'],['B4','D4'],['C1','C5'],['C2','C3'],['D1','D5'],['D2','D3']],
'5':[['A1','C1'],['A2','A4'],['A3','A5'],['B1','D1'],['B2','B4'],['B3','B5'],['C2','C4'],['C3','C5'],['D2','D4'],['D3','D5']],
'6':[['A1','B1'],['A2','B2'],['A3','B3'],['A4','B4'],['A5','B5'],['C1','D1'],['C2','D2'],['C3','D3'],['C4','D4'],['C5','D5']],
'7':[['A1','D1'],['A2','D2'],['A3','D3'],['A4','D4'],['A5','D5'],['B1','C1'],['B2','C2'],['B3','C3'],['B4','C4'],['B5','C5']],
'8':[['A1','D1'],['A2','D2'],['A3','D3'],['A4','D4'],['A5','D5'],['B1','C1'],['B2','C2'],['B3','C3'],['B4','C4'],['B5','C5']],
'9':[['A1','B1'],['A2','B2'],['A3','B3'],['A4','B4'],['A5','B5'],['C1','D1'],['C2','D2'],['C3','D3'],['C4','D4'],['C5','D5']],
'10':[['A1','C1'],['A2','A4'],['A3','A5'],['B1','D1'],['B2','B4'],['B3','B5'],['C2','C4'],['C3','C5'],['D2','D4'],['D3','D5']],
'11':[['A1','A5'],['A2','A3'],['A4','C4'],['B1','B5'],['B2','B3'],['B4','D4'],['C1','C5'],['C2','C3'],['D1','D5'],['D2','D3']],
'12':[['A1','A4'],['A2','A5'],['A3','C3'],['B1','B4'],['B2','B5'],['B3','D3'],['C1','C4'],['C2','C5'],['D1','D4'],['D2','D5']],
'13':[['A1','A3'],['A2','C2'],['A4','A5'],['B1','B3'],['B2','D2'],['B4','B5'],['C1','C3'],['C4','C5'],['D1','D3'],['D4','D5']],
'14':[['A1','A2'],['A3','A4'],['A5','C5'],['B1','B2'],['B3','B4'],['B5','D5'],['C1','C2'],['C3','C4'],['D1','D2'],['D3','D4']]};
function renderSchedule(divs){const pos={};['A','B','C','D'].forEach(l=>(divs[l]||[]).forEach((t,i)=>{if(t)pos[l+(i+1)]=t;}));if(Object.keys(pos).length<20){$('scheduleTitle').style.display='none';$('scheduleGrid').innerHTML='';return;}$('scheduleTitle').style.display='block';$('scheduleGrid').innerHTML=Object.entries(MATRIX).map(([w,games])=>`<section class="week"><h4>Spieltag ${w}</h4>${games.map(([a,b])=>`<div class="game"><span>${pos[a]||a}</span><b>VS</b><span>${pos[b]||b}</span></div>`).join('')}</section>`).join('');}
watchDivisions(d=>{const seq=d.revealSequence||[],count=Number(d.revealedCount||0),complete=d.divisions;const divs={A:[],B:[],C:[],D:[]};if(complete)Object.assign(divs,complete);else seq.slice(0,count).forEach(x=>divs[x.division][x.slot-1]=x.team);$('divisionGrid').innerHTML=['A','B','C','D'].map(l=>`<section class="division"><h3>Division ${l}</h3>${Array.from({length:5},(_,i)=>{const t=divs[l]?.[i];return `<div class="slot">${t?`<img src="${teamLogo(t)}" alt=""><span>${t}</span>`:`<span class="muted">${l}${i+1} · offen</span>`}</div>`}).join('')}</section>`).join('');renderSchedule(divs);if(count&&seq[count-1]){const x=seq[count-1];$('revealSlot').textContent=`DIVISION ${x.division} · PLATZ ${x.slot}`;$('revealLogo').src=teamLogo(x.team);$('revealTeam').textContent=x.team;}else if(complete){$('revealSlot').textContent='AUSLOSUNG ABGESCHLOSSEN';$('revealTeam').textContent=`Saison ${d.season||''}`;$('revealLogo').src='images/favicon.jpg';}});
</script></body></html>
