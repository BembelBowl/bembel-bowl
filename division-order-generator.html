<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Division-Auslosung | Bembel Bowl</title><link rel="icon" href="images/favicon.jpg"><link rel="stylesheet" href="css/style.css"><style>
header{position:fixed!important;top:0;left:0;width:100%;z-index:1000}body{padding-top:70px;background:#f4f1ea}.site-login-btn{margin-left:auto;background:#d18b2f;color:#fff;text-decoration:none;font-weight:700;padding:9px 16px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.12);transition:.2s}.site-login-btn:hover{background:#b8781f;transform:translateY(-1px)}.dog-header{text-align:center;margin:40px auto 20px;padding:0 25px}.dog-header h2{color:#d18b2f;font-size:2.5rem;margin-bottom:10px}.dog-header p{color:#666;font-size:1.05rem}.dog-container{max-width:1300px;margin:0 auto 60px;padding:0 25px}.dog-reveal-stage{background:#1f1f1f;border:3px solid #d18b2f;border-radius:12px;min-height:220px;display:flex;align-items:center;justify-content:center;gap:28px;padding:24px;margin-bottom:24px;box-shadow:0 8px 25px rgba(0,0,0,.25)}.dog-reveal-stage img{width:120px;height:120px;object-fit:cover;border-radius:12px}.dog-reveal-stage b{display:block;color:#d18b2f;font-size:1.05rem;letter-spacing:1px;margin-bottom:8px}.dog-reveal-stage h3{color:#fff;font-size:1.7rem;margin:0}.dog-division-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px}.dog-division-col{background:#fff;border-radius:12px;padding:16px;box-shadow:0 4px 15px rgba(0,0,0,.05)}.dog-division-title{text-align:center;font-weight:700;color:#fff;background:#1f1f1f;border-radius:8px;padding:8px;margin-bottom:12px;letter-spacing:1px}.dog-division-title .div-letter{color:#d18b2f}.dog-division-slot{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:#f8f6f0;border:2px dashed #e0ded6;border-radius:8px;padding:12px 8px;margin-bottom:10px;min-height:92px;justify-content:center}.dog-division-slot.filled{border:2px solid #d18b2f;background:#fff8ec}.dog-slot-logo{width:44px;height:44px;border-radius:6px;object-fit:cover;background:#1f1f1f}.dog-slot-name{font-size:.85rem;font-weight:600;color:#1f1f1f;line-height:1.2}.dog-slot-placeholder{font-size:.85rem;color:#aaa}.dog-schedule-title{color:#1f1f1f;border-bottom:3px solid #d18b2f;padding-bottom:8px;margin:10px 0 20px;font-size:1.4rem}.dog-schedule-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}.dog-schedule-tab{border:1px solid #e0ded6;background:#fff;color:#1f1f1f;border-radius:7px;padding:8px 12px;font-weight:700;cursor:pointer}.dog-schedule-tab:hover{border-color:#d18b2f;background:#fff8ec}.dog-schedule-tab.active{background:#d18b2f;border-color:#d18b2f;color:#fff}.dog-schedule-grid{display:grid;grid-template-columns:1fr;gap:16px}.dog-week-card{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 4px 15px rgba(0,0,0,.05)}.dog-week-title{font-weight:700;color:#d18b2f;font-size:.95rem;margin-bottom:10px;text-transform:uppercase}.dog-game-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed #e0ded6;font-size:.85rem;color:#1f1f1f}.dog-game-row:last-child{border-bottom:none}.dog-game-team{flex:1;min-width:0}.dog-vs{color:#bbb;font-weight:700;font-size:.75rem}@media(max-width:950px){.dog-division-grid{grid-template-columns:repeat(2,1fr)}.dog-schedule-grid{grid-template-columns:1fr}}@media(max-width:768px){header{position:sticky!important}body{padding-top:0}.dog-division-grid{grid-template-columns:1fr}.site-login-btn{margin-left:0}}
</style></head><body><header class="main-header"><nav class="navbar"><a href="index.html" class="nav-link">Home</a><a href="rules.html" class="nav-link">Regeln</a><a href="teams.html" class="nav-link">Teams</a><a href="draft-center.html" class="nav-link active">Draft Center</a><a href="standings.html" class="nav-link">Tabellen</a><a href="reports.html" class="nav-link">Spielberichte</a><a href="hall-of-fame.html" class="nav-link">Hall of Fame</a><a href="https://fantasy.espn.com/football/league?leagueId=843833275" class="nav-link" target="_blank">ESPN Fantasy Login</a><a href="login.html" class="site-login-btn">Login</a></nav></header><section class="dog-header"><h2>Division-Auslosung</h2><p>Live-Anzeige der vom Admin gesteuerten Auslosung</p></section><main class="dog-container"><section class="dog-reveal-stage"><img id="revealLogo" src="images/favicon.jpg" alt=""><div><b id="revealSlot">Warte auf Auslosung</b><h3 id="revealTeam">—</h3></div></section><div id="divisionGrid" class="dog-division-grid"></div><h3 id="scheduleTitle" class="dog-schedule-title" style="display:none">Spielplan</h3><div id="scheduleTabs" class="dog-schedule-tabs" style="display:none"></div><div id="scheduleGrid" class="dog-schedule-grid"></div></main><footer><p>© 2026 Bembel Bowl Fantasy Football League</p></footer><script type="module">
import { watchDivisions } from './js/draft/service.js'; import { teamLogo } from './js/draft/config.js'; const $=id=>document.getElementById(id);
const MATRIX={
'1':[['A1','A2'],['A3','A4'],['A5','C5'],['B1','B2'],['B3','B4'],['B5','D5'],['C1','C2'],['C3','C4'],['D1','D2'],['D3','D4']],
'2':[['A1','A3'],['A2','C2'],['A4','A5'],['B1','B3'],['B2','D2'],['B4','B5'],['C1','C3'],['C4','C5'],['D1','D3'],['D4','D5']],
'3':[['A1','A4'],['A2','A5'],['A3','C3'],['B1','B4'],['B2','B5'],['B3','D3'],['C1','C4'],['C2','C5'],['D1','D4'],['D2','D5']],
'4':[['A1','A5'],['A2','A3'],['A4','C4'],['B1','B5'],['B2','B3'],['B4','D4'],['C1','C5'],['C2','C3'],['D1','D5'],['D2','D3']],
'5':[['A1','C1'],['A2','A4'],['A3','A5'],['B1','D1'],['B2','B4'],['B3','B5'],['C2','C4'],['C3','C5'],['D2','D4'],['D3','D5']],
'6':[['A1','B1'],['A2','B2'],['A3','B3'],['A4','B4'],['A5','B5'],['C1','D1'],['C2','D2'],['C3','D3'],['C4','D4'],['C5','D5']],
'7':[['A1','D1'],['A2','D2'],['A3','D3'],['A4','D4'],['A5','D5'],['B1','C1'],['B2','C2'],['B3','C3'],['B4','C4'],['B5','C5']],
'8':[['A1','D1'],['A2','D2'],['A3','D3'],['A4','D4'],['A5','D5'],['B1','C1'],['B2','C2'],['B3','C3'],['B4','C4'],['B5','C5']],
'9':[['A1','B1'],['A2','B2'],['A3','B3'],['A4','B4'],['A5','B5'],['C1','D1'],['C2','D2'],['C3','D3'],['C4','D4'],['C5','D5']],
'10':[['A1','C1'],['A2','A4'],['A3','A5'],['B1','D1'],['B2','B4'],['B3','B5'],['C2','C4'],['C3','C5'],['D2','D4'],['D3','D5']],
'11':[['A1','A5'],['A2','A3'],['A4','C4'],['B1','B5'],['B2','B3'],['B4','D4'],['C1','C5'],['C2','C3'],['D1','D5'],['D2','D3']],
'12':[['A1','A4'],['A2','A5'],['A3','C3'],['B1','B4'],['B2','B5'],['B3','D3'],['C1','C4'],['C2','C5'],['D1','D4'],['D2','D5']],
'13':[['A1','A3'],['A2','C2'],['A4','A5'],['B1','B3'],['B2','D2'],['B4','B5'],['C1','C3'],['C4','C5'],['D1','D3'],['D4','D5']],
'14':[['A1','A2'],['A3','A4'],['A5','C5'],['B1','B2'],['B3','B4'],['B5','D5'],['C1','C2'],['C3','C4'],['D1','D2'],['D3','D4']]};
let selectedScheduleWeek='1';
function renderSchedule(divs){
  const pos={};['A','B','C','D'].forEach(l=>(divs[l]||[]).forEach((team,i)=>{if(team)pos[l+(i+1)]=team;}));
  if(Object.keys(pos).length<20){$('scheduleTitle').style.display='none';$('scheduleTabs').style.display='none';$('scheduleTabs').innerHTML='';$('scheduleGrid').innerHTML='';return;}
  $('scheduleTitle').style.display='block';
  $('scheduleTabs').style.display='flex';
  if(!MATRIX[selectedScheduleWeek]) selectedScheduleWeek='1';
  $('scheduleTabs').innerHTML=Object.keys(MATRIX).map(w=>`<button class="dog-schedule-tab ${w===selectedScheduleWeek?'active':''}" data-week="${w}">Spieltag ${w}</button>`).join('');
  const games=MATRIX[selectedScheduleWeek]||[];
  $('scheduleGrid').innerHTML=`<section class="dog-week-card"><h4 class="dog-week-title">Spieltag ${selectedScheduleWeek}</h4>${games.map(([a,b])=>`<div class="dog-game-row"><span class="dog-game-team">${pos[a]||a}</span><b class="dog-vs">VS</b><span class="dog-game-team">${pos[b]||b}</span></div>`).join('')}</section>`;
}
$('scheduleTabs').addEventListener('click',e=>{const btn=e.target.closest('[data-week]');if(!btn)return;selectedScheduleWeek=btn.dataset.week;renderSchedule(window.__bbDivisions||{A:[],B:[],C:[],D:[]});});
watchDivisions(d=>{const seq=d.revealSequence||[],count=Number(d.revealedCount||0),complete=d.divisions;const divs={A:[],B:[],C:[],D:[]};if(complete)Object.assign(divs,complete);else seq.slice(0,count).forEach(x=>divs[x.division][x.slot-1]=x.team);window.__bbDivisions=divs;$('divisionGrid').innerHTML=['A','B','C','D'].map(l=>`<section class="dog-division-col"><h3 class="dog-division-title">Division <span class="div-letter">${l}</span></h3>${Array.from({length:5},(_,i)=>{const t=divs[l]?.[i];return `<div class="dog-division-slot ${t?'filled':''}">${t?`<img class="dog-slot-logo" src="${teamLogo(t)}" alt=""><span class="dog-slot-name">${t}</span>`:`<span class="dog-slot-placeholder">${l}${i+1} · offen</span>`}</div>`}).join('')}</section>`).join('');renderSchedule(divs);if(count&&seq[count-1]){const x=seq[count-1];$('revealSlot').textContent=`DIVISION ${x.division} · PLATZ ${x.slot}`;$('revealLogo').src=teamLogo(x.team);$('revealTeam').style.display='';$('revealTeam').textContent=x.team;}else if(complete){$('revealSlot').textContent='AUSLOSUNG ABGESCHLOSSEN';$('revealTeam').textContent=d.season?`Saison ${d.season}`:'';$('revealTeam').style.display=d.season?'':'none';$('revealLogo').src='images/favicon.jpg';}});
</script><script src="js/site-nav.js" defer></script>
</body></html>
