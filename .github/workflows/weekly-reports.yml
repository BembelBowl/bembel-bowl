name: Weekly Reports

on:
  schedule:
    # Hauptlauf: Dienstag 12:17 Uhr Berliner Zeit.
    # Minute 17 vermeidet die besonders belastete volle Stunde.
    - cron: '17 12 * * 2'
      timezone: 'Europe/Berlin'

    # Sicherheitslauf: Dienstag 16:17 Uhr Berliner Zeit.
    # Bereits vorhandene Berichte werden uebersprungen; nur fehlende
    # Matchups werden noch erzeugt.
    - cron: '17 16 * * 2'
      timezone: 'Europe/Berlin'

  workflow_dispatch:
    inputs:
      week:
        description: 'Spieltag manuell ueberschreiben (optional, z.B. "1")'
        required: false
        default: ''
      force_run:
        description: 'Zeitpruefung ueberspringen und sofort ausfuehren'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      validate_only:
        description: 'Nur ESPN/Daten pruefen; keine KI und kein Firestore-Schreiben'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      smoke_test:
        description: 'Kompletter Verbindungstest: ESPN + Gemini + Firebase (Testdokument wird sofort geloescht)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

concurrency:
  group: weekly-reports
  cancel-in-progress: false

jobs:
  generate-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: pip install -r agent/requirements.txt

      - name: Python-Syntax pruefen
        run: python -m py_compile agent/generate_reports.py scripts/build_report_index.py

      - name: Spielberichte generieren
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          GEMINI_MODEL: gemini-3.6-flash
          WEEK_OVERRIDE: ${{ github.event.inputs.week }}

          # Ein Schedule-Lauf darf NIE an einer lokalen Uhrzeitpruefung scheitern.
          # GitHub kann geplante Jobs verspaetet starten.
          FORCE_RUN: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.force_run || 'false' }}

          VALIDATE_ONLY: ${{ github.event.inputs.validate_only || 'false' }}
          SMOKE_TEST: ${{ github.event.inputs.smoke_test || 'false' }}

          # Bei beiden automatischen Dienstag-Läufen vorhandene Berichte bewahren.
          # Der Sicherheitslauf erzeugt dadurch nur noch fehlende Matchups.
          SKIP_EXISTING: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          EXPECTED_MATCHUP_COUNT: '10'
        run: python agent/generate_reports.py
