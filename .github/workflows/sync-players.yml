name: Sync Player Database

on:
  schedule:
    # Täglich früh morgens; Minute 23 vermeidet die volle Stunde.
    - cron: '23 5 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:
    inputs:
      season:
        description: 'NFL-Saison (optional, z.B. 2026)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: sync-player-database
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install -r agent/requirements.txt

      - name: Syntax prüfen
        run: python -m py_compile agent/sync_players.py

      - name: Sleeper-Spielerdaten synchronisieren
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PLAYER_SEASON: ${{ github.event.inputs.season }}
        run: python agent/sync_players.py
