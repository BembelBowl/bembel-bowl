name: Update report index

on:
  push:
    paths:
      - 'reference-reports/**/*.md'
      - 'scripts/build_report_index.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build report index
        run: python scripts/build_report_index.py
      - name: Commit updated index
        run: |
          if git diff --quiet -- reference-reports/index.json; then
            echo "Index unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference-reports/index.json
          git commit -m "Update report index"
          git push
