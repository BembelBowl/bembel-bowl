.rp-header {

}

.rp-header h2 {

}

.rp-wrap {

}

/* --- STATUS / CONTROLS BAR --- */

.rp-controlbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    background: #ffffff;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 14px;

}

.rp-controls-left {

    align-items: center;
    gap: 12px;

}

.rp-label {
    font-size: 0.85rem;
    font-weight: 700;
    color: #1f1f1f;
}

.rp-select {
    padding: 7px 10px;
    border-radius: 6px;
    border: 1px solid #e0ded6;
    font-family: inherit;
    font-size: 0.85rem;
    background: #ffffff;
}

.rp-badge {
    display: inline-block;

    border-radius: 20px;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.5px;
}

.rp-badge-view {
    background: #e0ded6;
    color: #444;
}

.rp-badge-admin {
    background: #d18b2f;
    color: #ffffff;
}

.rp-btn {
    padding: 9px 16px;
    font-size: 0.85rem;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
}

.rp-btn-secondary {
    background-color: #ffffff;
    color: #1f1f1f;
    border: 2px solid #1f1f1f;
}

.rp-btn-secondary:hover {
    background-color: #1f1f1f;
    color: #ffffff;
}

.rp-btn-primary {
    background-color: #d18b2f;
    color: #ffffff;
}

.rp-btn-primary:hover {
    background-color: #b8781f;
}

.rp-btn-danger {
    background-color: #ffffff;
    color: #c92a2a;
    border: 2px solid #c92a2a;
}

.rp-btn-danger:hover {
    background-color: #c92a2a;
    color: #ffffff;
}

/* --- QUICK-NAV --- */

.rp-quicknav-wrap {
    position: sticky;
    top: 70px;
    z-index: 50;
    background: #f4f1ea;
    padding: 10px 0 14px;
    margin-bottom: 10px;
}

.rp-quicknav {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 6px 4px;
    background: #ffffff;
    border-radius: 30px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.rp-quicknav::-webkit-scrollbar {

}

.rp-quicknav-pill {
    flex: 0 0 auto;
    display: flex;

    gap: 6px;
    padding: 6px 14px;
    border-radius: 20px;
    background: #f8f6f0;

    font-size: 0.78rem;

}

.rp-quicknav-pill:hover {

}

.rp-quicknav-pill img {
    width: 18px;
    height: 18px;
    border-radius: 4px;

}

/* --- MATCHUP CARDS --- */

.rp-loading, .rp-error, .rp-empty {

    background: #ffffff;
    border-radius: 12px;

.rp-error {

}

.matchups-grid {

.rp-matchup {

}

.rp-team {

}

.rp-team.away {

}

.rp-team img {

.rp-team-info {

.rp-team-name {

.rp-team-score {

.rp-team.winner .rp-team-score {

}

.rp-vs {

/* --- BOX SCORE --- */

.rp-boxscore-toggle {

    margin: 10px auto 0;
    background: none;
    border: none;
    color: #d18b2f;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    padding: 4px;
}

.rp-boxscore-toggle:hover {

}

.rp-boxscore {

    gap: 16px;
    margin-top: 12px;
    padding-top: 12px;

}

.rp-boxscore.show {

<script>

let isAdmin = false;

/* ==========================================================

/* ==========================================================
   HELPERS
   ========================================================== */
function initialsAvatar(name) {
    const initial = ((name || '?').trim()[0] || '?').toUpperCase();
    const svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>"
        + "<rect width='100' height='100' rx='16' fill='%231f1f1f'/>"
        + "<text x='50' y='60' font-family='Segoe UI, Arial, sans-serif' font-size='42' font-weight='700' fill='%23d18b2f' text-anchor='middle'>"
        + initial + "</text></svg>";
    return 'data:image/svg+xml,' + encodeURIComponent(svg).replace(/'/g, '%27');
}

function setTeamLogo(imgEl, name) {
    const base = TEAM_LOGOS[name] || ('images/' + encodeURIComponent(name) + '.jpg');
    const baseNoExt = base.replace(/\.[a-zA-Z0-9]+$/, '');
    const attempts = [base, baseNoExt + '.jpeg', baseNoExt + '.png', baseNoExt + '.webp'];
    let i = 0;
    function tryNext() {
        if (i >= attempts.length) { imgEl.onerror = null; imgEl.src = initialsAvatar(name); return; }
        imgEl.src = attempts[i]; i++;
    }
    imgEl.onerror = tryNext;
    tryNext();
}

function reportDocId(year, week, index) {
    return year + '-w' + week + '-m' + index;
}

/* ==========================================================
   AUFBAU DER AUSWAHLFELDER
   ========================================================== */
function buildSeasonSelect() {
    seasonSelect.innerHTML = '';
    SEASONS.forEach(year => {
        const opt = document.createElement('option');
        opt.value = String(year);
        opt.textContent = 'Saison ' + year;
        seasonSelect.appendChild(opt);
    });
}

function buildWeekSelect(selectedWeek) {
    weekSelect.innerHTML = '';
    for (let w = 1; w <= WEEK_COUNT; w++) {
        const opt = document.createElement('option');
        opt.value = String(w);
        opt.textContent = 'Spieltag ' + w;
        if (w === selectedWeek) opt.selected = true;
        weekSelect.appendChild(opt);
    }
}

/* ==========================================================
   ESPN: SCOREBOARD EINES SPIELTAGS LADEN
   ========================================================== */
/* Lineup-Slot- und Positions-Mapping von ESPN (Standard-IDs, liga-/plattformweit gleich) */
const LINEUP_SLOT_MAP = {
    0: 'QB', 2: 'RB', 4: 'WR', 6: 'TE', 16: 'DEF', 17: 'K', 23: 'FLEX'
};
const BENCH_SLOTS = [20, 21]; // Bench, IR – werden im Box Score nicht angezeigt
const DEFAULT_POSITION_MAP = { 1: 'QB', 2: 'RB', 3: 'WR', 4: 'TE', 5: 'K', 16: 'DEF' };
// Reihenfolge, in der die Positionen im Box Score aufgelistet werden
const SLOT_ORDER = ['QB', 'RB', 'WR', 'TE', 'FLEX', 'DEF', 'K'];
// Mapping auf die bestehenden farbigen pos-tag-Klassen aus style.css
const POS_TAG_CLASS = { QB: 'pos-qb', RB: 'pos-rb', WR: 'pos-wr', TE: 'pos-te', K: 'pos-k', DEF: 'pos-def', FLEX: 'pos-def' };

async function fetchWeekMatchups(year, week) {
    const urls = [
        'https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/' + year + '/segments/0/leagues/' + LEAGUE_ID + '?view=mScoreboard&view=mMatchupScore&view=mTeam&view=mSettings&scoringPeriodId=' + week,
        'https://fantasy.espn.com/apis/v3/games/ffl/seasons/' + year + '/segments/0/leagues/' + LEAGUE_ID + '?view=mScoreboard&view=mMatchupScore&view=mTeam&view=mSettings&scoringPeriodId=' + week
    ];

    let lastErr = null;
    for (const url of urls) {
        try {
            const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
            if (!res.ok) throw new Error('ESPN HTTP ' + res.status);
            const json = await res.json();
            return parseEspnScoreboard(json, week);
        } catch (e) {
            lastErr = e;
        }
    }
    throw lastErr || new Error('ESPN nicht erreichbar');
}

// Extrahiert die Starter-Riege eines Teams (Position, Spielername, Punkte dieser Woche) aus dem ESPN-Roster-Objekt.
function parseBoxScoreSide(teamMatchupSide, week) {
    const roster = teamMatchupSide && (teamMatchupSide.rosterForCurrentScoringPeriod || teamMatchupSide.rosterForMatchupPeriod);
    if (!roster || !Array.isArray(roster.entries)) return [];

    const players = [];
    roster.entries.forEach(entry => {
        if (BENCH_SLOTS.includes(entry.lineupSlotId)) return; // nur Starter

        const player = entry.playerPoolEntry && entry.playerPoolEntry.player;
        if (!player) return;

        const slotName = LINEUP_SLOT_MAP[entry.lineupSlotId] || DEFAULT_POSITION_MAP[player.defaultPositionId] || '?';

        // Tatsächliche Punkte dieser Scoring-Periode suchen (statSourceId 0 = echte Werte, keine Prognose)
        let points = 0;
        if (Array.isArray(player.stats)) {
            const statEntry = player.stats.find(s => s.scoringPeriodId === week && s.statSourceId === 0);
            if (statEntry && statEntry.appliedTotal != null) points = statEntry.appliedTotal;
        }
        if (!points && entry.playerPoolEntry.appliedStatTotal != null) {
            points = entry.playerPoolEntry.appliedStatTotal;
        }

        players.push({
            name: player.fullName || 'Unbekannt',
            position: slotName,
            points: points || 0
        });
    });

    players.sort((a, b) => SLOT_ORDER.indexOf(a.position) - SLOT_ORDER.indexOf(b.position));
    return players;
}

function parseEspnScoreboard(json, week) {
    if (!json || !Array.isArray(json.teams) || !Array.isArray(json.schedule)) {
        throw new Error('Unerwartetes ESPN-Antwortformat');
    }

    const teamsById = {};
    json.teams.forEach(t => {
        const name = t.name || ((t.location || '') + ' ' + (t.nickname || '')).trim() || ('Team ' + t.id);
        teamsById[t.id] = name;
    });

    const games = json.schedule.filter(m => m.matchupPeriodId === week && m.home && m.away);

    return games.map(m => ({
        homeTeam: teamsById[m.home.teamId] || ('Team ' + m.home.teamId),
        awayTeam: teamsById[m.away.teamId] || ('Team ' + m.away.teamId),
        homeScore: (m.home.totalPoints != null ? m.home.totalPoints : 0),
        awayScore: (m.away.totalPoints != null ? m.away.totalPoints : 0),
        homeBoxScore: parseBoxScoreSide(m.home, week),
        awayBoxScore: parseBoxScoreSide(m.away, week)
    }));
}

/* ==========================================================
   RENDER: MATCHUPS + QUICK-NAV
   ========================================================== */
function detachReportListeners() {
    Object.values(reportListeners).forEach(unsub => unsub());
    for (const k in reportListeners) delete reportListeners[k];
}

function renderMatchups(year, week, matchups) {
    detachReportListeners();
    matchupsContainer.innerHTML = '';
    quicknav.innerHTML = '';

    if (matchups.length === 0) {
        matchupsContainer.innerHTML = '<div class="rp-empty">Für diesen Spieltag liegen noch keine Matchups vor.</div>';
        quicknavWrap.style.display = 'none';
        return;
    }

    quicknavWrap.style.display = 'block';

    matchups.forEach((m, index) => {
        const cardId = 'matchup-' + index;
        const docId = reportDocId(year, week, index);

        // Quick-Nav-Pill
        const pill = document.createElement('a');
        pill.className = 'rp-quicknav-pill';
        pill.href = '#' + cardId;
        const pillImg1 = document.createElement('img');
        setTeamLogo(pillImg1, m.homeTeam);
        const pillImg2 = document.createElement('img');
        setTeamLogo(pillImg2, m.awayTeam);
        pill.appendChild(pillImg1);
        pill.append(shortName(m.homeTeam) + ' vs ' + shortName(m.awayTeam));
        pill.appendChild(pillImg2);
        pill.addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById(cardId).scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        quicknav.appendChild(pill);

        // Matchup-Card
        const card = document.createElement('div');
        card.className = 'rp-matchup';
        card.id = cardId;

        const teamsRow = document.createElement('div');
        teamsRow.className = 'rp-matchup-teams';

        const homeWins = m.homeScore > m.awayScore;
        const awayWins = m.awayScore > m.homeScore;

        teamsRow.appendChild(buildTeamBlock(m.homeTeam, m.homeScore, homeWins, 'home'));
        const vs = document.createElement('div');
        vs.className = 'rp-vs';
        vs.textContent = 'VS';
        teamsRow.appendChild(vs);
        teamsRow.appendChild(buildTeamBlock(m.awayTeam, m.awayScore, awayWins, 'away'));

        card.appendChild(teamsRow);

        // Box Score (auf Wunsch einblendbar, hält die Übersicht kompakt)
        const hasBoxScore = (m.homeBoxScore && m.homeBoxScore.length) || (m.awayBoxScore && m.awayBoxScore.length);
        if (hasBoxScore) {
            const boxToggle = document.createElement('button');
            boxToggle.className = 'rp-boxscore-toggle';
            boxToggle.textContent = '📋 Box Score anzeigen';
            const boxPanel = document.createElement('div');
            boxPanel.className = 'rp-boxscore';
            boxPanel.appendChild(buildBoxScoreColumn(m.homeBoxScore));
            boxPanel.appendChild(buildBoxScoreColumn(m.awayBoxScore));
            boxToggle.addEventListener('click', () => {
                const showing = boxPanel.classList.toggle('show');
                boxToggle.textContent = showing ? '📋 Box Score ausblenden' : '📋 Box Score anzeigen';
            });
            card.appendChild(boxToggle);
            card.appendChild(boxPanel);
        }

        // Bericht-Anzeige
        const reportText = document.createElement('div');
        reportText.className = 'rp-report-text';
        reportText.style.display = 'none';
        card.appendChild(reportText);

        const reportEmpty = document.createElement('div');
        reportEmpty.className = 'rp-report-empty';
        reportEmpty.textContent = 'Noch kein Spielbericht vorhanden.';
        card.appendChild(reportEmpty);

        // Admin: Bearbeiten-Button + Editor
        const editBtn = document.createElement('button');
        editBtn.className = 'rp-btn rp-btn-secondary rp-report-edit-btn';
        editBtn.textContent = '✏️ Bericht bearbeiten';
        editBtn.style.display = 'none';
        card.appendChild(editBtn);

        const editor = document.createElement('div');
        editor.className = 'rp-report-editor';
        const textarea = document.createElement('textarea');
        textarea.placeholder = 'Spielbericht schreiben…';
        const editorActions = document.createElement('div');
        editorActions.className = 'rp-report-editor-actions';
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'rp-btn rp-btn-secondary';
        cancelBtn.textContent = 'Abbrechen';
        const clearBtn = document.createElement('button');
        clearBtn.className = 'rp-btn rp-btn-danger';
        clearBtn.textContent = 'Löschen';
        const saveBtn = document.createElement('button');
        saveBtn.className = 'rp-btn rp-btn-primary';
        saveBtn.textContent = 'Speichern';
        editorActions.appendChild(clearBtn);
        editorActions.appendChild(cancelBtn);
        editorActions.appendChild(saveBtn);
        editor.appendChild(textarea);
        editor.appendChild(editorActions);
        card.appendChild(editor);

        editBtn.addEventListener('click', () => {
            textarea.value = reportText.dataset.raw || '';
            editor.classList.add('show');
        });
        cancelBtn.addEventListener('click', () => editor.classList.remove('show'));
        saveBtn.addEventListener('click', () => {
            reportsCollection.doc(docId).set({
                text: textarea.value,
                homeTeam: m.homeTeam,
                awayTeam: m.awayTeam,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => editor.classList.remove('show'))
              .catch(err => alert('Speichern fehlgeschlagen: ' + err.message));
        });
        clearBtn.addEventListener('click', () => {
            if (!confirm('Spielbericht wirklich löschen?')) return;
            reportsCollection.doc(docId).delete()
                .then(() => editor.classList.remove('show'))
                .catch(err => alert('Löschen fehlgeschlagen: ' + err.message));
        });

        matchupsContainer.appendChild(card);

        // Live-Listener für diesen Bericht
        reportListeners[docId] = reportsCollection.doc(docId).onSnapshot(doc => {
            const text = doc.exists ? (doc.data().text || '') : '';
            if (text.trim()) {
                reportText.textContent = text;
                reportText.dataset.raw = text;
                reportText.style.display = 'block';
                reportEmpty.style.display = 'none';
            } else {
                reportText.style.display = 'none';
                reportText.dataset.raw = '';
                reportEmpty.style.display = isAdmin ? 'none' : 'block';
            }
            editBtn.style.display = isAdmin ? 'block' : 'none';
        });
    });
}

function buildBoxScoreColumn(players) {
    const col = document.createElement('div');
    col.className = 'rp-boxscore-col';
    if (!players || players.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'rp-boxscore-loading';
        empty.textContent = 'Kein Kader verfügbar.';
        col.appendChild(empty);
        return col;
    }
    players.forEach(p => {
        const row = document.createElement('div');
        row.className = 'rp-boxscore-row';

        const left = document.createElement('div');
        left.className = 'rp-boxscore-player';
        const tag = document.createElement('span');
        tag.className = 'pos-tag ' + (POS_TAG_CLASS[p.position] || 'pos-def');
        tag.textContent = p.position;
        const nameSpan = document.createElement('span');
        nameSpan.textContent = p.name;
        left.appendChild(tag);
        left.appendChild(nameSpan);

        const pts = document.createElement('span');
        pts.className = 'rp-boxscore-pts';
        pts.textContent = p.points.toFixed(1);

        row.appendChild(left);
        row.appendChild(pts);
        col.appendChild(row);
    });
    return col;
}

function buildTeamBlock(name, score, isWinner, side) {
    const wrap = document.createElement('div');
    wrap.className = 'rp-team' + (isWinner ? ' winner' : '') + (side === 'away' ? ' away' : '');
    const img = document.createElement('img');
    setTeamLogo(img, name);
    const info = document.createElement('div');
    info.className = 'rp-team-info';
    const nameDiv = document.createElement('div');
    nameDiv.className = 'rp-team-name';
    nameDiv.textContent = name;
    const scoreDiv = document.createElement('div');
    scoreDiv.className = 'rp-team-score';
    scoreDiv.textContent = score.toFixed(2);
    info.appendChild(nameDiv);
    info.appendChild(scoreDiv);
    wrap.appendChild(img);
    wrap.appendChild(info);
    return wrap;
}

function shortName(name) {
    return name.length > 14 ? name.slice(0, 13) + '…' : name;
}

/* ==========================================================
   LADEN BEI AUSWAHL
   ========================================================== */
async function loadSelectedWeek() {
    const year = parseInt(seasonSelect.value, 10);
    const week = parseInt(weekSelect.value, 10);
    statusArea.innerHTML = '<div class="rp-loading">Lade Spieltag…</div>';
    matchupsContainer.innerHTML = '';
    quicknavWrap.style.display = 'none';

    try {
        currentMatchups = await fetchWeekMatchups(year, week);
        statusArea.innerHTML = '';
        renderMatchups(year, week, currentMatchups);
    } catch (e) {
        console.error(e);
        statusArea.innerHTML = '<div class="rp-error">Spieltag konnte nicht von ESPN geladen werden (' + e.message + '). Das kann an CORS-Beschränkungen liegen oder daran, dass dieser Spieltag noch nicht gespielt wurde.</div>';
    }
}

seasonSelect.addEventListener('change', loadSelectedWeek);
weekSelect.addEventListener('change', loadSelectedWeek);

/* ==========================================================
   ADMIN-ANMELDUNG
   ========================================================== */
adminToggleBtn.addEventListener('click', () => {
    if (isAdmin) {
        auth.signOut();
    } else {
        authError.style.display = 'none';
        authEmail.value = '';
        authPassword.value = '';
        authModalOverlay.style.display = 'flex';
        setTimeout(() => authEmail.focus(), 50);
    }
});

authModalCloseBtn.addEventListener('click', () => authModalOverlay.style.display = 'none');
authModalOverlay.addEventListener('click', (e) => {
    if (e.target === authModalOverlay) authModalOverlay.style.display = 'none';
});

authSubmitBtn.addEventListener('click', async () => {
    authError.style.display = 'none';
    try {
        await auth.signInWithEmailAndPassword(authEmail.value.trim(), authPassword.value);
        authModalOverlay.style.display = 'none';
    } catch (err) {
        authError.textContent = 'Anmeldung fehlgeschlagen: E-Mail oder Passwort falsch.';
        authError.style.display = 'block';
    }
});

authPassword.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') authSubmitBtn.click();
});

auth.onAuthStateChanged((user) => {
    isAdmin = !!user;
    modeBadge.textContent = isAdmin ? 'ADMIN-MODUS' : 'ANSICHTSMODUS';
    modeBadge.className = 'rp-badge ' + (isAdmin ? 'rp-badge-admin' : 'rp-badge-view');
    adminToggleBtn.textContent = isAdmin ? '🔓 Abmelden' : '🔒 Admin-Modus';
    // Bearbeiten-Buttons neu anzeigen/verstecken, ohne komplett neu zu laden
    document.querySelectorAll('.rp-report-edit-btn').forEach(btn => {
        btn.style.display = isAdmin ? 'block' : 'none';
    });
});

/* ==========================================================
   INIT
   ========================================================== */
buildSeasonSelect();
buildWeekSelect(1);
loadSelectedWeek();
</script>
