<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bembel Bowl – Team Accounts</title>
  <link rel="icon" href="images/favicon.jpg">
  <style>
    :root{--bg:#0d0d0d;--card:#171717;--card2:#202020;--gold:#d5aa3a;--cream:#f4ead0;--text:#f7f3e8;--muted:#aaa;--danger:#df5b5b;--ok:#5ec985;--border:rgba(213,170,58,.3)}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 20% 0,#242019 0,#0d0d0d 42%);color:var(--text);font:15px/1.45 Arial,sans-serif;min-height:100vh}
    .main-header{background:#090909;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}.navbar{max-width:1200px;margin:auto;display:flex;gap:22px;padding:16px 20px}.nav-link{color:#ddd;text-decoration:none;font-weight:700}.nav-link:hover,.nav-link.active{color:var(--gold)}
    .ta-wrap{max-width:1180px;margin:36px auto;padding:0 20px 60px}.ta-card{background:linear-gradient(145deg,var(--card),#111);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:0 12px 34px rgba(0,0,0,.35);margin-bottom:18px}.ta-login{max-width:460px;margin:70px auto}.ta-grid{display:grid;grid-template-columns:minmax(220px,1.3fr) minmax(220px,1fr) minmax(180px,.8fr) auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07)}
    .ta-input{width:100%;padding:12px 13px;border-radius:10px;border:1px solid #444;background:#0f0f0f;color:#fff;outline:none}.ta-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(213,170,58,.12)}
    .ta-btn{border:0;border-radius:10px;padding:12px 16px;background:var(--gold);color:#15120a;font-weight:900;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.35)}.ta-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.ta-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}.ta-btn.dark{background:#2a2a2a;color:#fff}.ta-btn.ta-ok{background:#275c3c;color:#dff9e8}.ta-muted{font-size:12px;color:var(--muted);margin-top:2px}.ta-alert{display:none;padding:11px 12px;border-radius:9px;margin:12px 0;background:#4e1f1f;color:#ffd8d8}.ta-alert.show{display:block}.ta-info{padding:12px 14px;border-radius:10px;background:#15130e;border:1px solid var(--border);color:#ddd}.topline{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap} h1,h2{margin-top:0} code{color:#f6d679}
    @media(max-width:900px){.ta-grid{grid-template-columns:1fr}.ta-grid .ta-btn{width:100%}}
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
</head>
<body>
<header class="main-header"><nav class="navbar"><a href="index.html" class="nav-link">Home</a><a href="draft-center.html" class="nav-link active">Draft Center</a><a href="draft-board.html" class="nav-link">Draft Board</a></nav></header>
<main class="ta-wrap">
  <div id="login" class="ta-card ta-login">
    <h2>Admin-Login</h2>
    <div id="err" class="ta-alert"></div>
    <p><input id="email" class="ta-input" type="email" autocomplete="username" placeholder="Admin E-Mail"></p>
    <p><input id="password" class="ta-input" type="password" autocomplete="current-password" placeholder="Passwort"></p>
    <button id="loginBtn" class="ta-btn">Anmelden</button>
  </div>

  <div id="app" style="display:none">
    <div class="topline"><div><h1>Team-Accounts</h1><p>Je Fantasy-Team genau ein Firebase-Account.</p></div><button id="logout" class="ta-btn dark">Abmelden</button></div>
    <div class="ta-card">
      <div class="ta-info"><strong>Wichtig:</strong> Das Feld <code>teamId</code> wird mit dem exakten Teamnamen gespeichert, z. B. <code>Frankfurt Bakers</code>. Das ist erforderlich, damit Draft Board, Team Dashboard und Teamstatus dieselbe Kennung verwenden.</div>
      <div id="globalErr" class="ta-alert"></div>
      <div id="rows"></div>
    </div>
  </div>
</main>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyALAGTVbpTqMYmqmmf3dJyes0A39483iUE",
  authDomain: "bembel-bowl.firebaseapp.com",
  projectId: "bembel-bowl",
  storageBucket: "bembel-bowl.firebasestorage.app",
  messagingSenderId: "836256439134",
  appId: "1:836256439134:web:c39ef91c216da594020dcf"
};

const primaryApp = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
const db = primaryApp.firestore();
const auth = primaryApp.auth();
const secondaryApp = firebase.apps.find(a => a.name === 'team-account-creator') || firebase.initializeApp(firebaseConfig, 'team-account-creator');
const secondaryAuth = secondaryApp.auth();

const TEAMS = [
  "Amity Island Sharks","Beard","Bishop Sycamore","Bojangles P-Stars","Brady Gaga","Broken Bembels ULB","E-Town Elephants","Fighting Farmers","Foxboro Forever","Frankfurt Bakers","K-Town Devils","Packers Ultras","Pep's Band","Randy Moss Lob Jünger","Steelersnation 7","The 49vengers","the Boys","Thunder Ducks","Wiesbaden Phantoms","Zeugen Ray Lewis"
];

let profiles = [];
const $ = id => document.getElementById(id);
function showError(id, msg=''){ const el=$(id); el.textContent=msg; el.classList.toggle('show', !!msg); }

async function loadProfiles(){
  const snap = await db.collection('users').where('role','==','team').get();
  profiles = snap.docs.map(d => ({ uid:d.id, ...d.data() }));
}

function render(){
  const box=$('rows'); box.innerHTML='';
  TEAMS.forEach(name => {
    const existing = profiles.find(p => p.teamId === name);
    const row=document.createElement('div'); row.className='ta-grid';
    row.innerHTML = `
      <div><strong>${name}</strong><div class="ta-muted">teamId: ${name}</div></div>
      <input class="ta-input em" type="email" placeholder="team@email.de" ${existing ? `disabled value="${existing.email || ''}"` : ''}>
      <input class="ta-input pw" type="text" placeholder="Temporäres Passwort" ${existing ? 'disabled' : ''}>
      <button class="ta-btn create" ${existing ? 'disabled' : ''}>${existing ? '✓ Angelegt' : 'Account anlegen'}</button>`;
    const btn=row.querySelector('.create');
    if(existing) btn.classList.add('ta-ok');
    btn.addEventListener('click',()=>createAccount(row,name));
    box.appendChild(row);
  });
}

async function createAccount(row, teamName){
  showError('globalErr','');
  const email=row.querySelector('.em').value.trim();
  const password=row.querySelector('.pw').value;
  const btn=row.querySelector('.create');
  if(!email || password.length < 6){ showError('globalErr','Bitte gültige E-Mail und ein Passwort mit mindestens 6 Zeichen eingeben.'); return; }
  btn.disabled=true; btn.textContent='Wird angelegt…';
  try{
    const cred=await secondaryAuth.createUserWithEmailAndPassword(email,password);
    await db.collection('users').doc(cred.user.uid).set({ role:'team', teamId:teamName, email, createdAt:firebase.firestore.FieldValue.serverTimestamp() }, { merge:true });
    await secondaryAuth.signOut();
    await loadProfiles(); render();
  }catch(e){
    try{ await secondaryAuth.signOut(); }catch{}
    showError('globalErr', e?.message || String(e));
    btn.disabled=false; btn.textContent='Account anlegen';
  }
}

$('loginBtn').addEventListener('click', async()=>{
  showError('err',''); $('loginBtn').disabled=true;
  try{ await auth.signInWithEmailAndPassword($('email').value.trim(), $('password').value); }
  catch(e){ showError('err', e?.message || 'Anmeldung fehlgeschlagen.'); $('loginBtn').disabled=false; }
});
$('password').addEventListener('keydown', e=>{ if(e.key==='Enter') $('loginBtn').click(); });
$('logout').addEventListener('click',()=>auth.signOut());

auth.onAuthStateChanged(async user=>{
  if(!user){ $('login').style.display='block'; $('app').style.display='none'; $('loginBtn').disabled=false; return; }
  try{
    const prof=await db.collection('users').doc(user.uid).get();
    if(!prof.exists || prof.data().role !== 'admin') throw new Error('Dieses Konto besitzt keine Admin-Berechtigung.');
    $('login').style.display='none'; $('app').style.display='block';
    await loadProfiles(); render();
  }catch(e){ showError('err',e?.message || String(e)); await auth.signOut(); }
});
</script>
</body>
</html>
