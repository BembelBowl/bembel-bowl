<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draftboard | Bembel Bowl</title><link rel="icon" href="images/favicon.jpg"><link rel="stylesheet" href="css/style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
header{position:fixed!important;top:0;left:0;width:100%;z-index:1000}body{padding-top:70px;background:#f4f1ea}.site-login-btn{background:#d18b2f;color:#fff;text-decoration:none;font-weight:700;padding:9px 16px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.12);transition:.2s}.site-login-btn:hover{background:#b8781f;transform:translateY(-1px)}
.db-header{text-align:center;margin:40px auto 20px;padding:0 25px}.db-header h2{color:#d18b2f;font-size:2.5rem;margin-bottom:10px}.db-header p{color:#666;font-size:1.05rem}.db-wrap{max-width:1500px;margin:0 auto 60px;padding:0 25px}.db-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:#fff;border-radius:12px;padding:14px 18px;margin-bottom:18px;box-shadow:0 4px 15px rgba(0,0,0,.05)}.db-tabs{display:flex;gap:8px;flex-wrap:wrap}.db-tab{border:1px solid #e0ded6;background:#fff;color:#1f1f1f;border-radius:7px;padding:8px 13px;font-weight:700;cursor:pointer}.db-tab:hover{background:#f8f6f0;border-color:#d18b2f}.db-tab.active{background:#d18b2f;border-color:#d18b2f;color:#fff}.db-tab.live:after{content:' LIVE';font-size:.65rem}.db-actions{display:flex;gap:10px;flex-wrap:wrap}.db-action{padding:9px 14px;border-radius:8px;text-decoration:none;font-weight:700;background:#1f1f1f;color:#fff;border:0;cursor:pointer;font:inherit}.db-action.live{background:#d18b2f}.db-year-title{font-size:1.4rem;font-weight:700;color:#1f1f1f;margin:0 0 12px}.db-loading{text-align:center;color:#888;padding:30px;background:#fff;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.05)}.db-board-shell{overflow:auto;max-height:calc(100vh - 230px);background:#fff;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.05);padding:4px;position:relative}table.db-board{border-collapse:separate;border-spacing:4px;width:100%}.db-col-head{min-width:128px;background:#1f1f1f;color:#fff;border-radius:8px;padding:8px 6px;text-align:center;position:sticky;top:0;z-index:7}.db-col-head img{width:32px;height:32px;object-fit:cover;border-radius:6px;margin-bottom:4px}.db-col-head-name{font-size:.78rem;font-weight:700;line-height:1.15;word-break:break-word}.db-round-head{background:#d18b2f;color:#fff;border-radius:8px;padding:8px 10px;text-align:center;font-weight:700;position:sticky;left:0;z-index:8;min-width:60px}.db-board thead .db-round-head{top:0;z-index:9}.db-cell{min-width:128px;height:94px;border-radius:8px;background:#f8f6f0;border:2px dashed #e0ded6;padding:6px 8px;vertical-align:top;position:relative}.db-cell.filled{border:2px solid #e0ded6;background:#fff}.db-pick-num{position:absolute;top:4px;right:6px;font-size:.65rem;color:#aaa;font-weight:700}.db-cell .pos-tag{display:inline-block;font-size:.65rem;margin-top:12px;margin-bottom:4px;padding:3px 7px;border-radius:999px;background:#d18b2f;color:#fff;font-weight:700}.db-player-name{font-size:.8rem;font-weight:700;color:#1f1f1f;line-height:1.2}.db-player-nfl{font-size:.72rem;color:#777}.db-pick-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;font-size:.62rem;color:#777}.db-pick-meta span{background:#f3efe8;border-radius:999px;padding:2px 5px;white-space:nowrap}.pos-qb{background:#9b2c2c!important}.pos-rb{background:#2f855a!important}.pos-wr{background:#2b6cb0!important}.pos-te{background:#805ad5!important}.pos-k{background:#b7791f!important}.pos-def{background:#4a5568!important}@media(max-width:768px){header{position:sticky!important}body{padding-top:0}.db-header{margin-top:24px}.db-wrap{padding:0 12px}.site-login-btn{margin-left:0}}
</style></head><body><header class="main-header"><nav class="navbar"><a href="index.html" class="nav-link">Home</a><a href="rules.html" class="nav-link">Regeln</a><a href="teams.html" class="nav-link">Teams</a><a href="draft-center.html" class="nav-link active">Draft Center</a><a href="standings.html" class="nav-link">Tabellen</a><a href="reports.html" class="nav-link">Spielberichte</a><a href="hall-of-fame.html" class="nav-link">Hall of Fame</a><a href="https://fantasy.espn.com/football/league?leagueId=843833275" class="nav-link" target="_blank">ESPN Fantasy Login</a><a href="login.html" class="site-login-btn">Login</a></nav></header><section class="db-header"><h2>Draftboard</h2><p>20 Teams · 15 Runden · Snake Draft</p></section><main class="db-wrap"><div class="db-toolbar"><div id="seasonTabs" class="db-tabs"></div><div class="db-actions"><button id="fullscreenBtn" class="db-action" type="button">Vollbild</button><a id="liveScreenLink" href="draft-screen.html" class="db-action live" style="display:none">Live Draft Screen</a><a href="draft-stats.html" class="db-action">Draft-Statistiken</a></div></div><div id="boardTitle" class="db-year-title"></div><div id="boardArea" class="db-loading">Draftboard wird geladen…</div></main><footer><p>© 2026 Bembel Bowl Fantasy Football League</p></footer><script type="module">
import { db, collection, doc, onSnapshot, getDoc } from './js/draft/firebase.js'; import { watchBoard, watchState } from './js/draft/service.js'; import { DRAFT, teamLogo } from './js/draft/config.js';
const $=id=>document.getElementById(id); const STATIC_YEARS=[2026,2025,2024,2023,2022,2021,2020,2019,2018,2017]; let board={teams:[],picks:{}},state={},archiveYears=[],selected=null,cache={};
watchBoard(b=>{board=b; refresh();}); watchState(s=>{state=s; $('liveScreenLink').style.display=isDraftTrulyLive()?'inline-flex':'none'; refresh();}); onSnapshot(collection(db,'draftboard_archive'),snap=>{archiveYears=snap.docs.map(d=>Number(d.id)).filter(Number.isFinite); $('liveScreenLink').style.display=isDraftTrulyLive()?'inline-flex':'none'; refresh();});
function currentComplete(){return Object.keys(board.picks||{}).length>0 && !nextOpen(board.picks||{});}
function legacyComplete(){return typeof state.boardCreated!=='boolean' && currentComplete();}
function availableYears(){const set=new Set([...STATIC_YEARS,...archiveYears]); if((state.boardCreated||legacyComplete())&&state.season)set.add(Number(state.season)); return [...set].sort((a,b)=>b-a);}
function refresh(){const years=availableYears(); if(!years.length)return; const activeCurrent=(state.boardCreated&&['setup','live','complete'].includes(state.status))||legacyComplete(); if(selected==null) selected=activeCurrent?Number(state.season):(years.includes(2026)?2026:years[0]); if(!years.includes(selected)) selected=years[0]; renderTabs(years); loadYear(selected);}
function completedSeason(){return Math.max(2026,Number(state.lastCompletedSeason||0),...(archiveYears.length?archiveYears:[0]));}
function isDraftTrulyLive(){const season=Number(state.season||0);return !!state.boardCreated&&!!state.orderSet&&state.status==='live'&&season>completedSeason()&&!!nextOpen(board.picks||{});}
function renderTabs(years){$('seasonTabs').innerHTML=years.map(y=>`<button class="db-tab ${y===selected?'active':''} ${(Number(y)===Number(state.season)&&isDraftTrulyLive())?'live':''}" data-year="${y}">${y}</button>`).join('');}
$('seasonTabs').onclick=e=>{const y=Number(e.target.dataset.year);if(!y)return;selected=y;renderTabs(availableYears());loadYear(y);};
async function loadYear(year){$('boardTitle').textContent=`Draftboard ${year}`; $('boardArea').className='db-loading'; $('boardArea').textContent='Draftboard wird geladen…'; try{let data;if((state.boardCreated||legacyComplete())&&Number(state.season)===year){data={teamNames:board.teams||[],picks:board.picks||{},teamCount:DRAFT.teamCount,roundCount:DRAFT.roundCount};}else if(!state.boardCreated&&currentComplete()&&year===availableYears()[0]){data={teamNames:board.teams||[],picks:board.picks||{},teamCount:DRAFT.teamCount,roundCount:DRAFT.roundCount};}else if(cache[year])data=cache[year];else{const snap=await getDoc(doc(db,'draftboard_archive',String(year)));if(snap.exists()){const d=snap.data();data={teamNames:d.teamNames||[],picks:d.picks||{},teamCount:d.teamCount||DRAFT.teamCount,roundCount:d.roundCount||DRAFT.roundCount};}else data=await loadExcel(year);cache[year]=data;}renderBoard(data,year);if(!byeWeekCache[year])loadByeWeeks(year).then(()=>{if(selected===year)renderBoard(data,year);}).catch(()=>{});}catch(e){$('boardArea').className='db-loading';$('boardArea').textContent=`Draftboard ${year} nicht verfügbar: ${e.message}`;}}
const byeWeekCache={};const byeWeekLoading={};
function formatPickDuration(seconds){if(seconds===null||seconds===undefined||!Number.isFinite(Number(seconds)))return '–';const total=Math.max(0,Math.round(Number(seconds)));if(total<60)return `${total}s`;const min=Math.floor(total/60),sec=total%60;return `${min}:${String(sec).padStart(2,'0')} min`;}
function normalizeNflTeam(value){const raw=String(value||'').toUpperCase().trim();const aliases={JAC:'JAX',SD:'LAC',OAK:'LV',WSH:'WAS'};return aliases[raw]||raw;}
async function loadByeWeeks(year){if(byeWeekCache[year])return byeWeekCache[year];if(byeWeekLoading[year])return byeWeekLoading[year];byeWeekLoading[year]=(async()=>{const maxWeek=Number(year)>=2021?18:17,played={};const jobs=[];for(let week=1;week<=maxWeek;week++){const url=`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=${year}&seasontype=2&week=${week}&limit=100`;jobs.push(fetch(url).then(r=>r.ok?r.json():null).then(data=>({week,data})).catch(()=>({week,data:null})));}const results=await Promise.all(jobs);for(const {week,data} of results){for(const event of data?.events||[]){for(const c of event?.competitions?.[0]?.competitors||[]){const abbr=normalizeNflTeam(c?.team?.abbreviation);if(!abbr)continue;(played[abbr]??=new Set()).add(week);}}}const byes={};for(const [team,weeks] of Object.entries(played)){const missing=[];for(let w=1;w<=maxWeek;w++)if(!weeks.has(w))missing.push(w);if(missing.length===1)byes[team]=missing[0];}byeWeekCache[year]=byes;delete byeWeekLoading[year];return byes;})();return byeWeekLoading[year];}
function getByeWeek(year,nflTeam){return byeWeekCache[year]?.[normalizeNflTeam(nflTeam)]||null;}
function posClass(pos){return ({QB:'pos-qb',RB:'pos-rb',WR:'pos-wr',TE:'pos-te',K:'pos-k',DEF:'pos-def',DST:'pos-def','D/ST':'pos-def'})[String(pos||'').toUpperCase()]||'pos-def';}
function renderBoard(data,year=selected){const teams=data.teamNames||[],tc=data.teamCount||teams.length||DRAFT.teamCount,rc=data.roundCount||DRAFT.roundCount;let html='<div class="db-board-shell"><table class="db-board"><thead><tr><th class="db-round-head">R</th>';for(let p=0;p<tc;p++){const name=teams[p]||`Team ${p+1}`;html+=`<th class="db-col-head"><img src="${teamLogo(name)}" alt=""><div class="db-col-head-name">${esc(name)}</div></th>`;}html+='</tr></thead><tbody>';for(let r=1;r<=rc;r++){html+=`<tr><th class="db-round-head">R${r}</th>`;for(let p=1;p<=tc;p++){const pick=data.picks?.[`${r}-${p}`],num=pickNumber(r,p,tc);let content='';if(pick){const bye=getByeWeek(year,pick.nflTeam);content=`<span class="pos-tag ${posClass(pick.position)}">${esc(pick.position||'')}</span><div class="db-player-name">${esc(pick.name)}</div><div class="db-player-nfl">${esc(pick.nflTeam||'')}</div><div class="db-pick-meta"><span>Dauer: ${formatPickDuration(pick.pickDurationSeconds)}</span><span>Bye: ${bye?`W${bye}`:'–'}</span></div>`;}html+=`<td class="db-cell ${pick?'filled':''}"><span class="db-pick-num">#${num}</span>${content}</td>`;}html+='</tr>';}html+='</tbody></table></div>';$('boardArea').className='';$('boardArea').innerHTML=html;}
function pickNumber(round,pos,count){return round%2===1?(round-1)*count+pos:(round-1)*count+(count-pos+1);}
async function loadExcel(year){const res=await fetch(`files/bembelbowl_draft_${year}.xlsx`,{cache:'no-store'});if(!res.ok)throw new Error('Archivdatei nicht gefunden');const buf=await res.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});let sn=wb.SheetNames.find(n=>n.trim().toLowerCase()==='draft board')||wb.SheetNames.find(n=>{const x=n.toLowerCase();return x.includes('draft')&&x.includes('board')})||wb.SheetNames[0];const grid=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:null,raw:true});const cell=(r,c)=>grid[r-1]?.[c-1]??null;let tc=0;for(let i=0;i<24;i++){if(cell(2,4+5*i))tc=i+1;else break;}if(!tc)tc=DRAFT.teamCount;let rc=0;for(let i=0;i<30;i++){if(cell(4+3*i,2))rc=i+1;else break;}if(!rc)rc=DRAFT.roundCount;const teamNames=Array.from({length:tc},(_,i)=>String(cell(2,4+5*i)||`Team ${i+1}`));const picks={};for(let r=0;r<rc;r++)for(let i=0;i<tc;i++){const c=4+5*i,name=cell(4+3*r,c);if(name)picks[`${r+1}-${i+1}`]={name:String(name),nflTeam:String(cell(5+3*r,c)||''),position:String(cell(5+3*r,c+2)||'').toUpperCase().trim()};}return{teamNames,picks,teamCount:tc,roundCount:rc};}
function nextOpen(picks){for(let r=1;r<=DRAFT.roundCount;r++)for(let p=1;p<=DRAFT.teamCount;p++)if(!picks[`${r}-${p}`])return true;return false;}
$('fullscreenBtn').onclick=async()=>{const target=document.querySelector('.db-board-shell')||$('boardArea');try{if(!document.fullscreenElement){await target.requestFullscreen();$('fullscreenBtn').textContent='Vollbild beenden';}else{await document.exitFullscreen();}}catch(e){console.warn('Vollbild nicht verfügbar',e);}};document.addEventListener('fullscreenchange',()=>{$('fullscreenBtn').textContent=document.fullscreenElement?'Vollbild beenden':'Vollbild';});
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script><script src="js/site-nav.js" defer></script>
