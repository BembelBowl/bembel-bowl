<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draftboard | Bembel Bowl</title><link rel="icon" href="images/favicon.jpg"><link rel="stylesheet" href="css/style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><link rel="stylesheet" href="css/draft-master.css"></head>
<body class="master-page"><header class="main-header"><nav class="navbar"><a href="index.html" class="nav-link">Home</a><a href="rules.html" class="nav-link">Regeln</a><a href="teams.html" class="nav-link">Teams</a><a href="draft-center.html" class="nav-link active">Draft Center</a><a href="standings.html" class="nav-link">Tabellen</a><a href="reports.html" class="nav-link">Spielberichte</a><a href="hall-of-fame.html" class="nav-link">Hall of Fame</a><a href="https://fantasy.espn.com/football/league?leagueId=843833275" class="nav-link espn-btn" target="_blank">ESPN Fantasy Login</a><a href="login.html" class="site-login-btn">Login</a></nav></header>
<main class="master-wrap"><div class="db-top"><div><h2>Draftboard</h2><p>20 Teams · 15 Runden · Snake Draft</p></div><div class="db-actions"><a id="liveScreenLink" href="draft-screen.html" class="db-action live" style="display:none">Live Draft Screen</a><a href="draft-stats.html" class="db-action">Draft-Statistiken</a></div></div><div id="seasonTabs" class="db-tabs"></div><div id="boardTitle" class="db-year-title"></div><div id="boardArea" class="db-loading">Draftboard wird geladen…</div></main><footer><p>© 2026 Bembel Bowl Fantasy Football League</p></footer>
<script type="module">
import { db, collection, doc, onSnapshot, getDoc } from './js/draft/firebase.js'; import { watchBoard, watchState } from './js/draft/service.js'; import { DRAFT, teamLogo } from './js/draft/config.js';
const $=id=>document.getElementById(id); const STATIC_YEARS=[2026,2025,2024,2023,2022,2021,2020,2019,2018,2017]; let board={teams:[],picks:{}},state={},archiveYears=[],selected=null,cache={};
watchBoard(b=>{board=b; refresh();}); watchState(s=>{state=s; $('liveScreenLink').style.display=(s.boardCreated&&s.status!=='complete')?'inline-flex':'none'; refresh();}); onSnapshot(collection(db,'draftboard_archive'),snap=>{archiveYears=snap.docs.map(d=>Number(d.id)).filter(Number.isFinite); refresh();});
function currentComplete(){return Object.keys(board.picks||{}).length>0 && !nextOpen(board.picks||{});}
function legacyComplete(){return typeof state.boardCreated!=='boolean' && currentComplete();}
function availableYears(){const set=new Set([...STATIC_YEARS,...archiveYears]); if((state.boardCreated||legacyComplete())&&state.season)set.add(Number(state.season)); return [...set].sort((a,b)=>b-a);}
function refresh(){const years=availableYears(); if(!years.length)return; const activeCurrent=(state.boardCreated&&['setup','live','complete'].includes(state.status))||legacyComplete(); if(selected==null) selected=activeCurrent?Number(state.season):years[0]; if(!years.includes(selected)) selected=years[0]; renderTabs(years); loadYear(selected);}
function renderTabs(years){$('seasonTabs').innerHTML=years.map(y=>`<button class="db-tab ${y===selected?'active':''} ${(state.boardCreated&&Number(state.season)===y&&state.status==='live')?'live':''}" data-year="${y}">${y}</button>`).join('');}
$('seasonTabs').onclick=e=>{const y=Number(e.target.dataset.year);if(!y)return;selected=y;renderTabs(availableYears());loadYear(y);};
async function loadYear(year){$('boardTitle').textContent=`Draftboard ${year}`; $('boardArea').className='db-loading'; $('boardArea').textContent='Draftboard wird geladen…'; try{let data;if((state.boardCreated||legacyComplete())&&Number(state.season)===year){data={teamNames:board.teams||[],picks:board.picks||{},teamCount:DRAFT.teamCount,roundCount:DRAFT.roundCount};}else if(!state.boardCreated&&currentComplete()&&year===availableYears()[0]){data={teamNames:board.teams||[],picks:board.picks||{},teamCount:DRAFT.teamCount,roundCount:DRAFT.roundCount};}else if(cache[year])data=cache[year];else{const snap=await getDoc(doc(db,'draftboard_archive',String(year)));if(snap.exists()){const d=snap.data();data={teamNames:d.teamNames||[],picks:d.picks||{},teamCount:d.teamCount||DRAFT.teamCount,roundCount:d.roundCount||DRAFT.roundCount};}else data=await loadExcel(year);cache[year]=data;}renderBoard(data);}catch(e){$('boardArea').className='db-loading';$('boardArea').textContent=`Draftboard ${year} nicht verfügbar: ${e.message}`;}}
function posClass(pos){return ({QB:'pos-qb',RB:'pos-rb',WR:'pos-wr',TE:'pos-te',K:'pos-k',DEF:'pos-def',DST:'pos-def','D/ST':'pos-def'})[String(pos||'').toUpperCase()]||'pos-def';}
function renderBoard(data){const teams=data.teamNames||[],tc=data.teamCount||teams.length||DRAFT.teamCount,rc=data.roundCount||DRAFT.roundCount;let html='<div class="db-board-shell"><table class="db-board"><thead><tr><th class="db-round-head">R</th>';for(let p=0;p<tc;p++){const name=teams[p]||`Team ${p+1}`;html+=`<th class="db-col-head"><img src="${teamLogo(name)}" alt=""><div class="db-col-head-name">${esc(name)}</div></th>`;}html+='</tr></thead><tbody>';for(let r=1;r<=rc;r++){html+=`<tr><th class="db-round-head">R${r}</th>`;for(let p=1;p<=tc;p++){const pick=data.picks?.[`${r}-${p}`],num=pickNumber(r,p,tc);html+=`<td class="db-cell ${pick?'filled':''}"><span class="db-pick-num">#${num}</span>${pick?`<span class="pos-tag ${posClass(pick.position)}">${esc(pick.position||'')}</span><div class="db-player-name">${esc(pick.name)}</div><div class="db-player-nfl">${esc(pick.nflTeam||'')}</div>`:''}</td>`;}html+='</tr>';}html+='</tbody></table></div>';$('boardArea').className='';$('boardArea').innerHTML=html;}
function pickNumber(round,pos,count){return round%2===1?(round-1)*count+pos:(round-1)*count+(count-pos+1);}
async function loadExcel(year){const res=await fetch(`files/bembelbowl_draft_${year}.xlsx`,{cache:'no-store'});if(!res.ok)throw new Error('Archivdatei nicht gefunden');const buf=await res.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});let sn=wb.SheetNames.find(n=>n.trim().toLowerCase()==='draft board')||wb.SheetNames.find(n=>{const x=n.toLowerCase();return x.includes('draft')&&x.includes('board')})||wb.SheetNames[0];const grid=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:null,raw:true});const cell=(r,c)=>grid[r-1]?.[c-1]??null;let tc=0;for(let i=0;i<24;i++){if(cell(2,4+5*i))tc=i+1;else break;}if(!tc)tc=DRAFT.teamCount;let rc=0;for(let i=0;i<30;i++){if(cell(4+3*i,2))rc=i+1;else break;}if(!rc)rc=DRAFT.roundCount;const teamNames=Array.from({length:tc},(_,i)=>String(cell(2,4+5*i)||`Team ${i+1}`));const picks={};for(let r=0;r<rc;r++)for(let i=0;i<tc;i++){const c=4+5*i,name=cell(4+3*r,c);if(name)picks[`${r+1}-${i+1}`]={name:String(name),nflTeam:String(cell(5+3*r,c)||''),position:String(cell(5+3*r,c+2)||'').toUpperCase().trim()};}return{teamNames,picks,teamCount:tc,roundCount:rc};}
function nextOpen(picks){for(let r=1;r<=DRAFT.roundCount;r++)for(let p=1;p<=DRAFT.teamCount;p++)if(!picks[`${r}-${p}`])return true;return false;}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script></body></html>
