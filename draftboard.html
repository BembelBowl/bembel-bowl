<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bembel Bowl - Live Draftboard</title>
    <link rel="icon" type="image/jpeg" href="images/favicon.jpg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="draftboard-page">
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="draft-center.html">Zurück zum Center</a>
            <div class="year-selector-container">
                <select id="draftYearSelect" onchange="switchDraftYear()">
                    <option value="2026" selected>Saison 2026 (Live)</option>
                    <option value="2025">Saison 2025 (Archiv)</option>
                    <option value="2024">Saison 2024 (Archiv)</option>
                </select>
            </div>
            <button id="adminLoginBtn" class="espn-btn" style="background-color: #333;" onclick="toggleAdminMode()">Admin Login</button>
        </nav>
    </header>

    <!-- Definition der 20 Teamnamen direkt im HTML -->
    <div id="htmlTeamSource" style="display:none;">
        <span data-id="1" data-name="Bojangles Pornstars"></span>
        <span data-id="2" data-name="Zeugen Ray Lewis"></span>
        <span data-id="3" data-name="Team Name 3"></span>
        <span data-id="4" data-name="Team Name 4"></span>
        <span data-id="5" data-name="Team 5"></span>
        <span data-id="6" data-name="Team 6"></span>
        <span data-id="7" data-name="Team 7"></span>
        <span data-id="8" data-name="Team 8"></span>
        <span data-id="9" data-name="Team 9"></span>
        <span data-id="10" data-name="Team 10"></span>
        <span data-id="11" data-name="Team 11"></span>
        <span data-id="12" data-name="Team 12"></span>
        <span data-id="13" data-name="Team 13"></span>
        <span data-id="14" data-name="Team 14"></span>
        <span data-id="15" data-name="Team 15"></span>
        <span data-id="16" data-name="Team 16"></span>
        <span data-id="17" data-name="Team 17"></span>
        <span data-id="18" data-name="Team 18"></span>
        <span data-id="19" data-name="Team 19"></span>
        <span data-id="20" data-name="Team 20"></span>
    </div>

    <main class="draftboard-container">
        <!-- Admin-Panel -->
        <section id="adminControlArea" class="admin-panel" style="display: none;">
            <h3>🛠️ LM Draft-Steuerung</h3>
            <div class="admin-inputs">
                <input type="number" id="pickRound" placeholder="Runde (1-15)" min="1" max="15">
                
                <!-- Dynamisches Dropdown-Menü zur Teamauswahl im Admin Modus -->
                <select id="pickTeamSelect" class="admin-select">
                    <option value="">-- Team wählen --</option>
                </select>

                <div class="search-wrapper target-wider">
                    <input type="text" id="playerSearch" placeholder="Spielernamen eingeben & aus Vorschlägen wählen (z.B. Mahomes)..." oninput="searchPlayers()">
                    <div id="searchResults" class="autocomplete-results"></div>
                </div>
                
                <button onclick="submitManualPick()" class="espn-btn button-green">Pick setzen</button>
                <button onclick="deleteSelectedPick()" class="espn-btn button-red">Pick löschen</button>
            </div>
        </section>

        <!-- Die Draftboard Arena -->
        <div class="board-scroll-wrapper enforce-scrollbar">
            <div class="draft-board-grid" id="boardGrid">
                <!-- Wird per JS gerendert -->
            </div>
        </div>
    </main>

    <script type="module" src="js/draftboard.js"></script>
</body>
</html>
